<!-- ═══════════════ MODAL GENERYCZNY (CRUD) ═══════════════ -->
<div x-show="modal.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
     @keydown.escape.window="closeModal()">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100" x-text="modalTitle()"></h3>
            <button @click="closeModal()" class="text-2xl leading-none hover:text-red-500">&times;</button>
        </div>
        <form @submit.prevent="save()" class="p-6 space-y-4">
            <template x-for="field in fieldsFor(modal.view || currentView)" :key="field.key">
                <div>
                    <template x-if="field.type !== 'checkbox'">
                        <label class="block text-sm font-medium mb-1"><span x-text="field.label"></span><span x-show="field.required" class="text-red-500 ml-0.5">*</span></label>
                    </template>

                    <template x-if="field.type === 'checkbox'">
                        <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-700/40 hover:bg-gray-50 dark:hover:bg-gray-700/70 cursor-pointer transition select-none">
                            <input type="checkbox" x-model="modal.form[field.key]"
                                   class="w-5 h-5 rounded text-brand-600 focus:ring-brand-500 border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                            <div>
                                <span class="text-sm font-medium text-gray-800 dark:text-gray-200 block" x-text="field.label"></span>
                                <span class="text-xs text-gray-500 dark:text-gray-400 block" x-show="field.key === 'is_primary'" x-text="window.ZenI18n.t('Oznacz jako główną osobę kontaktową dla tego klienta')"></span>
                            </div>
                        </label>
                    </template>

                    <template x-if="field.type === &#x27;textarea&#x27;">
                        <textarea x-model="modal.form[field.key]" rows="4" :required="field.required"
                                  class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none font-mono text-sm"></textarea>
                    </template>

                    <template x-if="field.type === &#x27;select&#x27;">
                        <select x-model="modal.form[field.key]" :required="field.required"
                                class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                            <option value="" x-text="window.ZenI18n.t(&quot;— wybierz —&quot;)">— wybierz —</option>
                            <template x-for="opt in field.options" :key="opt.value">
                                <option :value="opt.value" x-text="opt.label"></option>
                            </template>
                        </select>
                    </template>

                    <template x-if="field.type === 'range'">
                        <div class="zen-probability-field">
                            <div class="zen-probability-control">
                                <input type="range" min="0" max="100" step="1" x-model.number="modal.form[field.key]"
                                       :aria-label="field.label" :style="'--probability:' + (Number(modal.form[field.key]) || 0) + '%'">
                                <output x-text="(Number(modal.form[field.key]) || 0) + '%'">0%</output>
                            </div>
                            <div class="zen-probability-scale" aria-hidden="true"><span>0%</span><span>100%</span></div>
                        </div>
                    </template>

                    <template x-if="field.type === &#x27;project-select&#x27;">
                        <select x-model="modal.form[field.key]" :required="field.required"
                                class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                            <option value="" x-text="window.ZenI18n.t(&quot;— brak powiązania z projektem —&quot;)">— brak powiązania z projektem —</option>
                            <template x-for="p in (projects || [])" :key="p.id">
                                <option :value="p.id" x-text="p.name + (p.client_name ? &#x27; (&#x27; + p.client_name + &#x27;)&#x27; : &#x27;&#x27;)"></option>
                            </template>
                        </select>
                    </template>

                    <template x-if="field.type === &#x27;multi-user-select&#x27;">
                        <div class="multi-user-wrap">
                            <!-- Wybrane osoby jako chips -->
                            <div class="flex flex-wrap gap-2 mb-2" x-show="(modal.form[field.key] || []).length &gt; 0">
                                <template x-for="uid in (modal.form[field.key] || [])" :key="uid">
                                    <div class="inline-flex items-center gap-2 pl-1 pr-2 py-1 rounded-full bg-brand-50 border border-brand-100 dark:bg-gray-700 dark:border-gray-600">
                                        <template x-if="usersById[uid]?.avatar_url">
                                            <img :src="usersById[uid].avatar_url" class="w-6 h-6 rounded-full object-cover">
                                        </template>
                                        <template x-if="!usersById[uid]?.avatar_url">
                                            <div class="w-6 h-6 rounded-full avatar-gradient text-white flex items-center justify-center text-[10px] font-bold"
                                                 x-text="initialsFrom(usersById[uid])"></div>
                                        </template>
                                        <span class="text-sm font-medium text-brand-700 dark:text-brand-300"
                                              x-text="usersById[uid] ? fullName(usersById[uid]) : (&#x27;#&#x27; + uid)"></span>
                                        <button type="button" @click="removeMultiUser(field.key, uid); removeServiceAssignee(uid);"
                                                class="w-4 h-4 rounded-full bg-brand-200 text-brand-700 hover:bg-brand-300 flex items-center justify-center text-xs leading-none">
                                            ×
                                        </button>
                                    </div>
                                </template>
                            </div>

                            <!-- Dropdown do dodawania -->
                            <div class="user-select-wrap zen-person-picker" x-data="{ open: false, search: &#x27;&#x27; }" @click.outside="open = false" @keydown.escape.stop="open = false">
                                <button type="button" class="user-select-btn" @click="open = !open" :aria-expanded="open"><span class="zen-icon-wrap" x-html="zenIcon(&#x27;user&#x27;)" aria-hidden="true"></span> <span x-text="window.ZenI18n.t(&quot;Dodaj osobę&quot;)">Dodaj osobę</span></button>
                                <div x-show="open" x-cloak class="user-select-dropdown"><div class="user-select-search"><input type="search" x-model="search" :placeholder="window.ZenI18n.t(&quot;Szukaj osoby…&quot;)" :aria-label="window.ZenI18n.t(&quot;Szukaj osoby&quot;)"></div>
                                <template x-for="u in (availableMultiUsers(field.key)).filter(u =&gt; fullName(u).toLocaleLowerCase(locale).includes(search.toLocaleLowerCase(locale)))" :key="u.id"><button type="button" class="user-select-option" @click="addMultiUser(field.key, u.id); addServiceAssignee(u.id); open = false; search = &#x27;&#x27;;"><span class="user-select-avatar"><template x-if="u.avatar_url"><img :src="u.avatar_url" alt=""></template><template x-if="!u.avatar_url"><span x-text="initialsFrom(u)"></span></template></span><span x-text="fullName(u)"></span></button></template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template x-if="field.type === 'teams-select'">
                        <div class="space-y-2">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <template x-for="tm in (teams || [])" :key="'m-team-' + tm.id">
                                    <button type="button"
                                            @click="if (!modal.form.team_ids) modal.form.team_ids = []; const i = modal.form.team_ids.indexOf(tm.id); if (i > -1) modal.form.team_ids.splice(i, 1); else modal.form.team_ids.push(tm.id);"
                                            class="px-2.5 py-1 rounded-lg text-xs font-semibold border transition flex items-center gap-1.5 cursor-pointer"
                                            :style="(modal.form.team_ids || []).includes(tm.id) ? { backgroundColor: tm.color || '#018bfc', color: '#fff', borderColor: tm.color || '#018bfc' } : { backgroundColor: 'transparent', borderColor: '#d1d5db', color: '#4b5563' }">
                                        <span class="w-2 h-2 rounded-full" :style="{ backgroundColor: (modal.form.team_ids || []).includes(tm.id) ? '#fff' : (tm.color || '#018bfc') }"></span>
                                        <span x-text="tm.name"></span>
                                    </button>
                                </template>
                            </div>
                            <p x-show="!(teams || []).length" class="text-xs text-gray-400 italic" x-text="window.ZenI18n.t('Brak utworzonych zespołów')"></p>
                        </div>
                    </template>

                    <template x-if="field.type === &#x27;user-select&#x27;">
                        <div class="user-select-wrap" x-data="{ open: false, search: &#x27;&#x27; }" @click.outside="open = false">
                            <button type="button" @click="open = !open" class="user-select-btn">
                                <template x-if="modal.form[field.key] &amp;&amp; usersById[modal.form[field.key]]">
                                    <span class="user-select-avatar">
                                        <template x-if="usersById[modal.form[field.key]].avatar_url">
                                            <img :src="usersById[modal.form[field.key]].avatar_url">
                                        </template>
                                        <template x-if="!usersById[modal.form[field.key]].avatar_url">
                                            <span x-text="initialsFrom(usersById[modal.form[field.key]])"></span>
                                        </template>
                                    </span>
                                </template>
                                <template x-if="!modal.form[field.key] || !usersById[modal.form[field.key]]">
                                    <span class="user-select-avatar empty">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                    </span>
                                </template>
                                <span class="user-select-label"
                                      :class="!modal.form[field.key] ? &#x27;placeholder&#x27; : &#x27;&#x27;"
                                      x-text="modal.form[field.key] &amp;&amp; usersById[modal.form[field.key]] ? fullName(usersById[modal.form[field.key]]) : window.ZenI18n.t(&#x27;Wybierz osobę…&#x27;)"></span>
                                <svg class="user-select-chevron" :class="open ? &#x27;open&#x27; : &#x27;&#x27;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                                </svg>
                            </button>

                            <div x-show="open" x-cloak x-transition.opacity.duration.100ms class="user-select-dropdown">
                                <div class="user-select-search">
                                    <input type="text" x-model="search" :placeholder="window.ZenI18n.t(&quot;Szukaj osoby…&quot;)" @click.stop>
                                </div>

                                <!-- Bez przypisania -->
                                <button type="button" @click="modal.form[field.key] = null; open = false; search = &#x27;&#x27;" class="user-select-option">
                                    <span class="user-select-avatar empty">—</span>
                                    <span class="name" style="color:#9ca3af;"><span x-text="window.ZenI18n.t(&quot;Bez przypisania&quot;)">Bez przypisania</span></span>
                                </button>

                                <!-- Lista userów -->
                                <template x-for="u in users.filter(x =&gt; !search || fullName(x).toLowerCase().includes(search.toLowerCase()))" :key="u.id">
                                    <button type="button" @click="modal.form[field.key] = u.id; open = false; search = &#x27;&#x27;"
                                            class="user-select-option"
                                            :class="modal.form[field.key] === u.id ? &#x27;selected&#x27; : &#x27;&#x27;">
                                        <span class="user-select-avatar">
                                            <template x-if="u.avatar_url">
                                                <img :src="u.avatar_url">
                                            </template>
                                            <template x-if="!u.avatar_url">
                                                <span x-text="initialsFrom(u)"></span>
                                            </template>
                                        </span>
                                        <div style="flex:1; min-width:0;">
                                            <div class="name" x-text="fullName(u)"></div>
                                            <div class="role" x-text="roleLabel(u.role)"></div>
                                        </div>
                                        <template x-if="modal.form[field.key] === u.id">
                                            <svg class="check" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                                        </template>
                                    </button>
                                </template>

                                <p x-show="users.filter(x =&gt; !search || fullName(x).toLowerCase().includes(search.toLowerCase())).length === 0"
                                   style="padding: 16px; text-align: center; font-size: 13px; color: #9ca3af;">
                                    <span x-text="window.ZenI18n.t(&quot;Brak wyników&quot;)">Brak wyników</span>
                                </p>
                            </div>
                        </div>
                    </template>

                    <template x-if="field.type === &#x27;template-select&#x27;">
                        <div>
                            <select x-model="modal.form[field.key]"
                                    class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                                <option value="" x-text="window.ZenI18n.t(&quot;— brak / wybierz szablon —&quot;)">— brak / wybierz szablon —</option>
                                <template x-for="t in templates.filter(x =&gt; x.type === (currentView === &#x27;offers&#x27; ? &#x27;offer&#x27; : &#x27;document&#x27;))" :key="t.id">
                                    <option :value="t.id" x-text="t.name"></option>
                                </template>
                            </select>
                            <p class="text-xs text-gray-500 mt-1"
                               x-show="templates.filter(x =&gt; x.type === (currentView === &#x27;offers&#x27; ? &#x27;offer&#x27; : &#x27;document&#x27;)).length === 0">
                                <span x-text="window.ZenI18n.t(&quot;Brak dostępnych szablonów. Dodaj w menu&quot;)">Brak dostępnych szablonów. Dodaj w menu</span> <strong><span x-text="window.ZenI18n.t(&quot;Szablony&quot;)">Szablony</span></strong>.
                            </p>
                        </div>
                    </template>

                    <template x-if="field.type === &#x27;catalog-select&#x27;">
                        <select x-model="modal.form[field.key]"
                                class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                            <option value="" x-text="window.ZenI18n.t(&quot;— brak —&quot;)">— brak —</option>
                            <template x-for="c in serviceCatalog" :key="c.id">
                                <option :value="c.id" x-text="c.name"></option>
                            </template>
                        </select>
                    </template>

                    <template x-if="field.type === &#x27;document-relation&#x27;">
<div x-data="documentRelationPicker(field)" class="zen-relation-picker">
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="enabled" @change="if (!enabled) clear()" :disabled="(modal.view || currentView) !== &#x27;tasks&#x27; &amp;&amp; !modal.form.client_id &amp;&amp; !enabled"><span x-text="field.key === &#x27;lead_id&#x27; ? window.ZenI18n.t(&#x27;Powiąż z leadem&#x27;) : window.ZenI18n.t(&#x27;Powiąż z usługą&#x27;)"></span></label>
    <p class="ux-muted mt-1" x-show="(modal.view || currentView) !== &#x27;tasks&#x27; &amp;&amp; !modal.form.client_id"><span x-text="window.ZenI18n.t(&quot;Najpierw wybierz klienta. Powiązanie nie jest wymagane.&quot;)">Najpierw wybierz klienta. Powiązanie nie jest wymagane.</span></p>
    <div x-show="enabled" class="mt-2 space-y-2">
        <p class="ux-muted" x-show="loading"><span x-text="window.ZenI18n.t(&quot;Ładowanie…&quot;)">Ładowanie…</span></p>
        <div class="ux-error" x-show="error"><span x-text="error"></span><button type="button" @click="load()"><span x-text="window.ZenI18n.t(&quot;Ponów&quot;)">Ponów</span></button></div>
        <div x-show="modal.form[field.key]" class="flex items-center justify-between gap-2 p-2 rounded-lg bg-brand-50 dark:bg-gray-700"><span x-text="chosen?.title || chosen?.name || (loading ? window.ZenI18n.t(&#x27;Ładowanie nazwy…&#x27;) : window.ZenI18n.t(&#x27;Powiązany rekord niedostępny dla tego klienta&#x27;))"></span><button type="button" class="ux-text-button" @click="clear()"><span x-text="window.ZenI18n.t(&quot;Odłącz&quot;)">Odłącz</span></button></div>
        <input type="search" x-model.debounce.150ms="search" class="ux-input w-full" :placeholder="window.ZenI18n.t(&quot;Szukaj po nazwie…&quot;)" :aria-label="field.label + window.ZenI18n.t(&#x27; — szukaj po nazwie&#x27;)" :disabled="((modal.view || currentView) !== &#x27;tasks&#x27; &amp;&amp; !modal.form.client_id) || loading">
        <div x-show="!loading &amp;&amp; !error &amp;&amp; (modal.form.client_id || (modal.view || currentView) === &#x27;tasks&#x27;)" class="max-h-40 overflow-y-auto border rounded-lg dark:border-gray-600">
            <template x-for="item in matches" :key="item.id"><button type="button" class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700" :aria-pressed="Number(modal.form[field.key]) === item.id" @click="choose(item)"><span x-text="item.title || item.name"></span><span class="ml-2 text-brand-600" x-show="Number(modal.form[field.key]) === item.id" x-html="zenIcon(&#x27;check&#x27;)"></span></button></template>
            <p class="ux-muted p-3" x-show="!matches.length" x-text="items.length ? window.ZenI18n.t(&#x27;Brak wyników dla tej nazwy.&#x27;) : window.ZenI18n.t(&#x27;Brak powiązanych rekordów tego klienta.&#x27;)"></p>
        </div>
    </div>
</div>
</template>
<template x-if="field.type === 'lead-select'">
    <div x-data="leadPicker(field)">
        <select x-model.number="modal.form[field.key]" :disabled="loading || !!error" :aria-label="field.label"
                class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
            <option value="" x-text="window.ZenI18n.t('— brak —')"></option>
            <template x-for="lead in items" :key="lead.id">
                <option :value="lead.id" :selected="Number(modal.form[field.key]) === lead.id" x-text="lead.title"></option>
            </template>
        </select>
        <p x-show="loading" class="ux-muted mt-1" role="status" x-text="window.ZenI18n.t('Ładowanie…')"></p>
        <div x-show="error" class="ux-error mt-1" role="alert">
            <span x-text="error"></span>
            <button type="button" @click="load()" x-text="window.ZenI18n.t('Ponów')"></button>
        </div>
    </div>
</template>
<template x-if="field.type === &#x27;client-select&#x27;">
                        <select x-model="modal.form[field.key]"
                                class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                            <option value="" x-text="window.ZenI18n.t(&quot;— brak —&quot;)">— brak —</option>
                            <template x-for="c in clients" :key="c.id">
                                <option :value="c.id" x-text="c.name"></option>
                            </template>
                        </select>
                    </template>

                    <template x-if="![&#x27;textarea&#x27;,&#x27;select&#x27;,&#x27;client-select&#x27;,&#x27;user-select&#x27;,&#x27;template-select&#x27;,&#x27;catalog-select&#x27;,&#x27;task-assignees&#x27;,&#x27;multi-user-select&#x27;,&#x27;document-relation&#x27;,&#x27;lead-select&#x27;,&#x27;checkbox&#x27;,'range'].includes(field.type)">
                        <input :type="field.type" x-model="modal.form[field.key]" :required="field.required"
                               class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                    </template>
                </div>
            </template>

            <!-- POLA WŁASNE (CUSTOM FIELDS) -->
            <div x-show="customFields && customFields.length > 0" x-cloak class="pt-4 border-t border-gray-200 dark:border-gray-700">
                <div class="flex items-center gap-2 mb-3">
                    <svg class="w-4 h-4 text-brand-600 dark:text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h10"/></svg>
                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wider" x-text="window.ZenI18n.t('Pola własne')">Pola własne</h4>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <template x-for="cf in customFields" :key="'cf-input-' + cf.id">
                        <div :class="cf.kind === 'textarea' ? 'sm:col-span-2' : ''">
                            <label class="block text-sm font-medium mb-1"><span x-text="cf.label"></span><span x-show="cf.required" class="text-red-500 ml-0.5">*</span></label>
                            <template x-if="cf.kind === 'text'">
                                <input type="text" x-model="modal.form['custom_' + cf.id]" :required="cf.required"
                                       class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                            </template>
                            <template x-if="cf.kind === 'number'">
                                <input type="number" step="any" x-model="modal.form['custom_' + cf.id]" :required="cf.required"
                                       class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                            </template>
                            <template x-if="cf.kind === 'date'">
                                <input type="date" x-model="modal.form['custom_' + cf.id]" :required="cf.required"
                                       class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                            </template>
                            <template x-if="cf.kind === 'textarea'">
                                <textarea x-model="modal.form['custom_' + cf.id]" rows="3" :required="cf.required"
                                          class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none text-sm"></textarea>
                            </template>
                            <template x-if="cf.kind === 'boolean'">
                                <select x-model="modal.form['custom_' + cf.id]" :required="cf.required"
                                        class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                                    <option value="" x-text="window.ZenI18n.t('— wybierz —')">— wybierz —</option>
                                    <option value="true" x-text="window.ZenI18n.t('Tak')">Tak</option>
                                    <option value="false" x-text="window.ZenI18n.t('Nie')">Nie</option>
                                </select>
                            </template>
                        </div>
                    </template>
                </div>
            </div>

            <p x-show="modal.error" x-text="modal.error" class="text-red-500 text-sm"></p>

            <!-- WIELU WYKONAWCÓW (tylko dla zadań) -->
            <div x-show="(modal.view || currentView) === 'tasks'" x-cloak>
                <label class="block text-sm font-medium mb-2"><span x-text="window.ZenI18n.t(&quot;Wykonawcy i statusy&quot;)">Wykonawcy i statusy</span></label>
                <div class="space-y-2 mb-3">
                    <template x-for="ta in taskAssigneesUI" :key="ta.user_id">
                        <div class="flex items-center gap-2 bg-gray-50 dark:bg-gray-700/50 rounded-lg p-2">
                            <template x-if="ta.user?.avatar_url">
                                <img :src="ta.user.avatar_url" class="w-8 h-8 rounded-full object-cover flex-shrink-0">
                            </template>
                            <template x-if="!ta.user?.avatar_url">
                                <div class="w-8 h-8 rounded-full avatar-gradient text-white flex items-center justify-center text-xs font-bold flex-shrink-0"
                                     x-text="initialsFrom(ta.user)"></div>
                            </template>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium truncate" x-text="fullName(ta.user)"></p>
                                <input type="text" x-model="ta.comment" :placeholder="window.ZenI18n.t(&quot;komentarz/status…&quot;)"
                                       class="w-full text-xs bg-transparent border-0 outline-none text-gray-500 p-0 mt-0.5">
                            </div>
                            <select :disabled="!canChangeTaskPerson(ta)" x-model="ta.status"
                                    class="text-xs px-2 py-1 rounded border dark:bg-gray-700 dark:border-gray-600">
                                <option value="pending" x-text="window.ZenI18n.t(&quot;Oczekuje&quot;)">Oczekuje</option>
                                <option value="in_progress" x-text="window.ZenI18n.t(&quot;W toku&quot;)">W toku</option>
                                <option value="done" x-text="window.ZenI18n.t(&quot;Zrobione&quot;)">Zrobione</option>
                            </select>
                            <button x-show="canChangeTaskPerson(ta)" type="button" @click="taskAssigneesUI = taskAssigneesUI.filter(x =&gt; x.user_id !== ta.user_id)"
                                    class="text-red-500 hover:text-red-700 text-lg leading-none">×</button>
                        </div>
                    </template>
                    <p x-show="taskAssigneesUI.length === 0" class="text-xs text-gray-500 italic">
                        <span x-text="window.ZenI18n.t(&quot;Brak wykonawców. Dodaj osobę poniżej.&quot;)">Brak wykonawców. Dodaj osobę poniżej.</span>
                    </p>
                </div>
                <div class="user-select-wrap zen-person-picker" x-data="{ open: false, search: '' }" @click.outside="open = false" @keydown.escape.stop="open = false">
<button type="button" class="user-select-btn" @click="open = !open" :aria-expanded="open"><span class="zen-icon-wrap" x-html="zenIcon('user')" aria-hidden="true"></span> <span x-text="window.ZenI18n.t(&quot;Dodaj wykonawcę&quot;)">Dodaj wykonawcę</span></button>
<div x-show="open" x-cloak class="user-select-dropdown"><div class="user-select-search"><input type="search" x-model="search" :placeholder="window.ZenI18n.t(&quot;Szukaj osoby…&quot;)" :aria-label="window.ZenI18n.t(&quot;Szukaj osoby&quot;)"></div>
<template x-for="u in (users.filter(u =&gt; !taskAssigneesUI.some(a =&gt; a.user_id === u.id))).filter(u =&gt; fullName(u).toLocaleLowerCase(locale).includes(search.toLocaleLowerCase(locale)))" :key="u.id"><button type="button" class="user-select-option" @click="addTaskAssignee(u.id); open = false; search = ''"><span class="user-select-avatar"><template x-if="u.avatar_url"><img :src="u.avatar_url" alt=""></template><template x-if="!u.avatar_url"><span x-text="initialsFrom(u)"></span></template></span><span x-text="fullName(u)"></span></button></template>
</div></div>
            </div>

            <div class="flex justify-between gap-2 pt-2 border-t border-gray-200 dark:border-gray-700 mt-2">
                <div>
                    <button type="button" x-show="modal.editingId && canRecordAction(modal.view || currentView, 'delete')" @click="archiveFromModal()"
                            class="px-4 py-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 font-medium text-sm inline-flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                        <span x-text="window.ZenI18n.t(&quot;Do archiwum&quot;)">Do archiwum</span>
                    </button>
                    <button type="button" x-show="modal.editingId &amp;&amp; isAdmin" @click="permanentDeleteFromModal()"
                            class="ml-2 px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-medium text-sm inline-flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        <span x-text="window.ZenI18n.t(&quot;Usuń trwale&quot;)">Usuń trwale</span>
                    </button>
                </div>
                <div class="flex gap-2">
                    <button type="button" @click="closeModal()"
                            class="px-4 py-2 rounded-lg border dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700"><span x-text="window.ZenI18n.t(&quot;Anuluj&quot;)">Anuluj</span></button>
                    <button type="submit" :disabled="savingRecord"
                            class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium inline-flex items-center gap-2">
                        <svg x-show="savingRecord" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        <span x-text="window.ZenI18n.t(&quot;Zapisz&quot;)">Zapisz</span>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
