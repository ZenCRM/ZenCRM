<!-- ═══════════════ MODAL GENERYCZNY (CRUD) ═══════════════ -->
<div x-show="modal.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-3 sm:p-4 md:p-6"
     @keydown.escape.window="closeModal()">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-h-[92vh] flex flex-col overflow-hidden" :class="['documents', 'offers'].includes(modal.view || currentView) ? 'max-w-4xl' : 'max-w-3xl'">

        <!-- HEADER -->
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 bg-gray-50/70 dark:bg-gray-800/80 flex justify-between items-center flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-950/60 dark:text-brand-300 border border-brand-100 dark:border-brand-800/60 flex items-center justify-center flex-shrink-0 shadow-2xs">
                    <template x-if="(modal.view || currentView) === 'clients'">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    </template>
                    <template x-if="(modal.view || currentView) === 'leads'">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                    </template>
                    <template x-if="(modal.view || currentView) === 'contacts'">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </template>
                    <template x-if="(modal.view || currentView) === 'tasks'">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                    </template>
                    <template x-if="(modal.view || currentView) === 'projects'">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                    </template>
                    <template x-if="!['clients','leads','contacts','tasks','projects'].includes(modal.view || currentView)">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </template>
                </div>
                <div>
                    <h3 class="text-base sm:text-lg font-bold text-gray-900 dark:text-gray-100" x-text="modalTitle()"></h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400">
                        <span x-show="modal.editingId" x-text="window.ZenI18n.t('Wprowadź zmiany i zapisz rekord')">Wprowadź zmiany i zapisz rekord</span>
                        <span x-show="!modal.editingId" x-text="window.ZenI18n.t('Uzupełnij pola formularza, aby dodać nowy wpis')">Uzupełnij pola formularza, aby dodać nowy wpis</span>
                    </p>
                </div>
            </div>
            <button type="button" @click="closeModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition" :aria-label="window.ZenI18n.t(&quot;Zamknij&quot;)">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- FORM BODY (RESPONSIVE GRID) -->
        <form @submit.prevent="save()" class="flex-1 overflow-y-auto p-6 space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="field in fieldsFor(modal.view || currentView)" :key="field.key">
                    <div :class="(['textarea', 'document-relation', 'multi-user-select', 'range', 'teams-select', 'template-select'].includes(field.type) || ['name', 'title', 'address', 'notes', 'content', 'description'].includes(field.key)) ? 'md:col-span-2' : 'md:col-span-1'">

                        <!-- Etykieta pola (z wyjątkiem checkbox) -->
                        <template x-if="field.type !== 'checkbox'">
                            <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                                <span x-text="field.label"></span>
                                <span x-show="field.required && (!modal.editingId || field.key !== 'password')" class="text-red-500 ml-1 font-bold">*</span>
                            </label>
                        </template>

                        <!-- CHECKBOX -->
                        <template x-if="field.type === 'checkbox'">
                            <label class="flex items-center gap-3 p-3.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50/60 dark:bg-gray-800/40 hover:bg-gray-100/60 dark:hover:bg-gray-750 cursor-pointer transition select-none">
                                <input type="checkbox" x-model="modal.form[field.key]"
                                       class="w-5 h-5 rounded text-brand-600 focus:ring-brand-500 border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                                <div>
                                    <span class="text-sm font-semibold text-gray-800 dark:text-gray-200 block" x-text="field.label"></span>
                                    <span class="text-xs text-gray-500 dark:text-gray-400 block" x-show="field.key === 'is_primary'" x-text="window.ZenI18n.t('Oznacz jako główną osobę kontaktową dla tego klienta')"></span>
                                </div>
                            </label>
                        </template>

                        <!-- TEXTAREA -->
                        <template x-if="field.type === 'textarea'">
                            <textarea x-model="modal.form[field.key]" rows="3" :required="field.required"
                                      class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 placeholder-gray-400 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs outline-none transition-all font-sans"></textarea>
                        </template>

                        <!-- STANDARD SELECT -->
                        <template x-if="field.type === 'select'">
                            <select x-model="modal.form[field.key]" :required="field.required"
                                    class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs outline-none transition-all">
                                <option value="" x-text="window.ZenI18n.t('— wybierz —')">— wybierz —</option>
                                <template x-for="opt in field.options" :key="opt.value">
                                    <option :value="opt.value" x-text="opt.label"></option>
                                </template>
                            </select>
                        </template>

                        <!-- RANGE (Prawdopodobieństwo) -->
                        <template x-if="field.type === 'range'">
                            <div class="zen-probability-field">
                                <div class="zen-probability-control">
                                    <input type="range" min="0" max="100" step="1" x-model.number="modal.form[field.key]"
                                           :aria-label="field.label" :style="'--probability:' + (Number(modal.form[field.key]) || 0) + '%'">
                                    <output x-text="(Number(modal.form[field.key]) || 0) + '%'">0%</output>
                                </div>
                                <div class="zen-probability-scale" aria-hidden="true"><span>0%</span><span>100%</span></div>
                            </div>
                        </template>

                        <!-- PROJEKT SELECT (tylko dropdown, NIGDY nie generuje inputu z ID!) -->
                        <template x-if="field.type === 'project-select'">
                            <select x-model="modal.form[field.key]" :required="field.required"
                                    class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs outline-none transition-all">
                                <option value="" x-text="window.ZenI18n.t('— brak powiązania z projektem —')">— brak powiązania z projektem —</option>
                                <template x-for="p in (projects || [])" :key="p.id">
                                    <option :value="p.id" x-text="p.name + (p.client_name ? ' (' + p.client_name + ')' : '')"></option>
                                </template>
                            </select>
                        </template>

                        <!-- MULTI USER SELECT -->
                        <template x-if="field.type === 'multi-user-select'">
                            <div class="multi-user-wrap">
                                <div class="flex flex-wrap gap-2 mb-2" x-show="(modal.form[field.key] || []).length > 0">
                                    <template x-for="uid in (modal.form[field.key] || [])" :key="uid">
                                        <div class="inline-flex items-center gap-2 pl-1 pr-2 py-1 rounded-full bg-brand-50 border border-brand-100 dark:bg-gray-700 dark:border-gray-600">
                                            <template x-if="usersById[uid]?.avatar_url">
                                                <img :src="usersById[uid].avatar_url" class="w-6 h-6 rounded-full object-cover">
                                            </template>
                                            <template x-if="!usersById[uid]?.avatar_url">
                                                <div class="w-6 h-6 rounded-full avatar-gradient text-white flex items-center justify-center text-[10px] font-bold"
                                                     x-text="initialsFrom(usersById[uid])"></div>
                                            </template>
                                            <span class="text-sm font-medium text-brand-700 dark:text-brand-300"
                                                  x-text="usersById[uid] ? fullName(usersById[uid]) : ('#' + uid)"></span>
                                            <button type="button" @click="removeMultiUser(field.key, uid); removeServiceAssignee(uid);"
                                                    class="w-4 h-4 rounded-full bg-brand-200 text-brand-700 hover:bg-brand-300 flex items-center justify-center text-xs leading-none">
                                                ×
                                            </button>
                                        </div>
                                    </template>
                                </div>
                                <div class="user-select-wrap zen-person-picker" x-data="{ open: false, search: '' }" @click.outside="open = false" @keydown.escape.stop="open = false">
                                    <button type="button" class="user-select-btn" @click="open = !open" :aria-expanded="open"><span class="zen-icon-wrap" x-html="zenIcon('user')" aria-hidden="true"></span> <span x-text="window.ZenI18n.t('Dodaj osobę')">Dodaj osobę</span></button>
                                    <div x-show="open" x-cloak class="user-select-dropdown"><div class="user-select-search"><input type="search" x-model="search" :placeholder="window.ZenI18n.t('Szukaj osoby…')" :aria-label="window.ZenI18n.t('Szukaj osoby')"></div>
                                    <template x-for="u in (availableMultiUsers(field.key)).filter(u => fullName(u).toLocaleLowerCase(locale).includes(search.toLocaleLowerCase(locale)))" :key="u.id"><button type="button" class="user-select-option" @click="addMultiUser(field.key, u.id); addServiceAssignee(u.id); open = false; search = '';"><span class="user-select-avatar"><template x-if="u.avatar_url"><img :src="u.avatar_url" alt=""></template><template x-if="!u.avatar_url"><span x-text="initialsFrom(u)"></span></template></span><span x-text="fullName(u)"></span></button></template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- TEAMS SELECT -->
                        <template x-if="field.type === 'teams-select'">
                            <div class="space-y-2">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <template x-for="tm in (teams || [])" :key="'m-team-' + tm.id">
                                        <button type="button"
                                                @click="if (!modal.form.team_ids) modal.form.team_ids = []; const i = modal.form.team_ids.indexOf(tm.id); if (i > -1) modal.form.team_ids.splice(i, 1); else modal.form.team_ids.push(tm.id);"
                                                class="px-2.5 py-1 rounded-lg text-xs font-semibold border transition flex items-center gap-1.5 cursor-pointer"
                                                :style="(modal.form.team_ids || []).includes(tm.id) ? { backgroundColor: tm.color || '#018bfc', color: '#fff', borderColor: tm.color || '#018bfc' } : { backgroundColor: 'transparent', borderColor: '#d1d5db', color: '#4b5563' }">
                                            <span class="w-2 h-2 rounded-full" :style="{ backgroundColor: (modal.form.team_ids || []).includes(tm.id) ? '#fff' : (tm.color || '#018bfc') }"></span>
                                            <span x-text="tm.name"></span>
                                        </button>
                                    </template>
                                </div>
                                <p x-show="!(teams || []).length" class="text-xs text-gray-400 italic" x-text="window.ZenI18n.t('Brak utworzonych zespołów')"></p>
                            </div>
                        </template>

                        <!-- USER SELECT -->
                        <template x-if="field.type === 'user-select'">
                            <div class="user-select-wrap" x-data="{ open: false, search: '' }" @click.outside="open = false">
                                <button type="button" @click="open = !open" class="user-select-btn">
                                    <template x-if="modal.form[field.key] && usersById[modal.form[field.key]]">
                                        <span class="user-select-avatar">
                                            <template x-if="usersById[modal.form[field.key]].avatar_url">
                                                <img :src="usersById[modal.form[field.key]].avatar_url">
                                            </template>
                                            <template x-if="!usersById[modal.form[field.key]].avatar_url">
                                                <span x-text="initialsFrom(usersById[modal.form[field.key]])"></span>
                                            </template>
                                        </span>
                                    </template>
                                    <template x-if="!modal.form[field.key] || !usersById[modal.form[field.key]]">
                                        <span class="user-select-avatar empty">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                        </span>
                                    </template>
                                    <span class="user-select-label"
                                          :class="!modal.form[field.key] ? 'placeholder' : ''"
                                          x-text="modal.form[field.key] && usersById[modal.form[field.key]] ? fullName(usersById[modal.form[field.key]]) : window.ZenI18n.t('Wybierz osobę…')"></span>
                                    <svg class="user-select-chevron" :class="open ? 'open' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                                    </svg>
                                </button>

                                <div x-show="open" x-cloak x-transition.opacity.duration.100ms class="user-select-dropdown">
                                    <div class="user-select-search">
                                        <input type="text" x-model="search" :placeholder="window.ZenI18n.t('Szukaj osoby…')" @click.stop>
                                    </div>
                                    <button type="button" @click="modal.form[field.key] = null; open = false; search = ''" class="user-select-option">
                                        <span class="user-select-avatar empty">—</span>
                                        <span class="name" style="color:#9ca3af;"><span x-text="window.ZenI18n.t('Bez przypisania')">Bez przypisania</span></span>
                                    </button>
                                    <template x-for="u in users.filter(x => !search || fullName(x).toLowerCase().includes(search.toLowerCase()))" :key="u.id">
                                        <button type="button" @click="modal.form[field.key] = u.id; open = false; search = ''"
                                                class="user-select-option"
                                                :class="modal.form[field.key] === u.id ? 'selected' : ''">
                                            <span class="user-select-avatar">
                                                <template x-if="u.avatar_url">
                                                    <img :src="u.avatar_url">
                                                </template>
                                                <template x-if="!u.avatar_url">
                                                    <span x-text="initialsFrom(u)"></span>
                                                </template>
                                            </span>
                                            <div style="flex:1; min-width:0;">
                                                <div class="name" x-text="fullName(u)"></div>
                                                <div class="role" x-text="roleLabel(u.role)"></div>
                                            </div>
                                            <template x-if="modal.form[field.key] === u.id">
                                                <svg class="check" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                                            </template>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- TEMPLATE SELECT -->
                        <template x-if="field.type === 'document-type-select'">
                            <select x-model="modal.form.type" @change="changeDocumentType()" class="ux-input w-full" required>
                                <option value="" disabled x-text="window.ZenI18n.t('— wybierz —')"></option>
                                <template x-for="kind in documentTypes.filter(t => t.is_active || t.key === modal.form.type)" :key="kind.key"><option :value="kind.key" x-text="kind.name"></option></template>
                            </select>
                        </template>

                        <template x-if="field.type === 'template-select'">
                            <div>
                                <select x-model="modal.form[field.key]"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs outline-none transition-all">
                                    <option value="" x-text="window.ZenI18n.t('— brak / wybierz szablon —')">— brak / wybierz szablon —</option>
                                    <template x-for="t in templates.filter(x => x.type === ((modal.view || currentView) === 'offers' ? 'offer' : 'document') && ((modal.view || currentView) === 'offers' || !x.document_type_key || x.document_type_key === modal.form.type))" :key="t.id">
                                        <option :value="t.id" x-text="t.name"></option>
                                    </template>
                                </select>
                            </div>
                        </template>

                        <!-- CATALOG SELECT -->
                        <template x-if="field.type === 'catalog-select'">
                            <select x-model="modal.form[field.key]"
                                    class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs outline-none transition-all">
                                <option value="" x-text="window.ZenI18n.t('— brak —')">— brak —</option>
                                <template x-for="c in serviceCatalog" :key="c.id">
                                    <option :value="c.id" x-text="c.name"></option>
                                </template>
                            </select>
                        </template>

                        <!-- DOCUMENT RELATION -->
                        <template x-if="field.type === 'document-relation'">
                            <div x-data="documentRelationPicker(field)" class="zen-relation-picker p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-750">
                                <label class="flex items-center gap-2 text-xs font-semibold"><input type="checkbox" x-model="enabled" @change="if (!enabled) clear()" :disabled="(modal.view || currentView) !== 'tasks' && !modal.form.client_id && !enabled"><span x-text="field.key === 'lead_id' ? window.ZenI18n.t('Powiąż z leadem') : window.ZenI18n.t('Powiąż z usługą')"></span></label>
                                <p class="ux-muted mt-1 text-xs" x-show="(modal.view || currentView) !== 'tasks' && !modal.form.client_id"><span x-text="window.ZenI18n.t('Najpierw wybierz klienta. Powiązanie nie jest wymagane.')">Najpierw wybierz klienta. Powiązanie nie jest wymagane.</span></p>
                                <div x-show="enabled" class="mt-2 space-y-2">
                                    <p class="ux-muted text-xs" x-show="loading"><span x-text="window.ZenI18n.t('Ładowanie…')">Ładowanie…</span></p>
                                    <div class="ux-error text-xs" x-show="error"><span x-text="error"></span><button type="button" @click="load()"><span x-text="window.ZenI18n.t('Ponów')">Ponów</span></button></div>
                                    <div x-show="modal.form[field.key]" class="flex items-center justify-between gap-2 p-2 rounded-lg bg-brand-50 dark:bg-gray-700 text-xs"><span x-text="chosen?.title || chosen?.name || (loading ? window.ZenI18n.t('Ładowanie nazwy…') : window.ZenI18n.t('Powiązany rekord niedostępny dla tego klienta'))"></span><button type="button" class="ux-text-button" @click="clear()"><span x-text="window.ZenI18n.t('Odłącz')">Odłącz</span></button></div>
                                    <input type="search" x-model.debounce.150ms="search" class="w-full px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-xs" :placeholder="window.ZenI18n.t('Szukaj po nazwie…')" :aria-label="field.label + window.ZenI18n.t(' — szukaj po nazwie')" :disabled="((modal.view || currentView) !== 'tasks' && !modal.form.client_id) || loading">
                                    <div x-show="!loading && !error && (modal.form.client_id || (modal.view || currentView) === 'tasks')" class="max-h-40 overflow-y-auto border rounded-lg dark:border-gray-600">
                                        <template x-for="item in matches" :key="item.id"><button type="button" class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 text-xs" :aria-pressed="Number(modal.form[field.key]) === item.id" @click="choose(item)"><span x-text="item.title || item.name"></span><span class="ml-2 text-brand-600" x-show="Number(modal.form[field.key]) === item.id" x-html="zenIcon('check')"></span></button></template>
                                        <p class="ux-muted p-2 text-xs" x-show="!matches.length" x-text="items.length ? window.ZenI18n.t('Brak wyników dla tej nazwy.') : window.ZenI18n.t('Brak powiązanych rekordów tego klienta.')"></p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- LEAD SELECT -->
                        <template x-if="field.type === 'lead-select'">
                            <div x-data="leadPicker(field)">
                                <select x-model.number="modal.form[field.key]" :disabled="loading || !!error" :aria-label="field.label"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs outline-none transition-all">
                                    <option value="" x-text="window.ZenI18n.t('— brak —')"></option>
                                    <template x-for="lead in items" :key="lead.id">
                                        <option :value="lead.id" :selected="Number(modal.form[field.key]) === lead.id" x-text="lead.title"></option>
                                    </template>
                                </select>
                            </div>
                        </template>

                        <!-- CLIENT SELECT -->
                        <template x-if="field.type === 'client-select'">
                            <select x-model="modal.form[field.key]"
                                    class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs outline-none transition-all">
                                <option value="" x-text="window.ZenI18n.t('— brak klienta —')">— brak klienta —</option>
                                <template x-for="c in clients" :key="c.id">
                                    <option :value="c.id" x-text="c.name + (c.company ? ' (' + c.company + ')' : '')"></option>
                                </template>
                            </select>
                        </template>

                        <!-- STANDARD INPUT (EXCLUDES ALL SPECIAL TYPES INCLUDING project-select & teams-select!) -->
                        <template x-if="!['textarea','select','client-select','project-select','teams-select','user-select','template-select','document-type-select','catalog-select','task-assignees','multi-user-select','document-relation','lead-select','checkbox','range'].includes(field.type)">
                            <input :type="field.type" x-model="modal.form[field.key]"
                                   :required="(field.key === 'password' && modal.editingId) ? false : Boolean(field.required)"
                                   :minlength="field.type === 'password' ? 10 : null"
                                   :autocomplete="field.type === 'password' ? 'new-password' : null"
                                   class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 placeholder-gray-400 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs outline-none transition-all">
                        </template>

                    </div>
                </template>
            </div>

            <div x-show="(modal.view || currentView) === 'documents' && selectedDocumentTypeFields().length" class="rounded-2xl border border-brand-100 dark:border-brand-900/50 bg-brand-50/40 dark:bg-gray-750 p-4 sm:p-5 space-y-4">
                <div class="flex items-center gap-3 border-b border-brand-100 dark:border-gray-700 pb-3">
                    <div class="w-9 h-9 rounded-xl bg-white dark:bg-gray-800 text-brand-600 dark:text-brand-300 flex items-center justify-center shadow-xs" x-html="zenIcon('document')"></div>
                    <div><h4 class="text-sm font-bold text-gray-900 dark:text-gray-100" x-text="documentTypeLabel(modal.form.type)"></h4><p class="text-xs text-gray-500 dark:text-gray-400" x-text="window.ZenI18n.t('Pola typu dokumentu')">Pola typu dokumentu</p></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-4">
                    <template x-for="field in selectedDocumentTypeFields()" :key="field.key">
                        <div :class="field.kind === 'textarea' ? 'sm:col-span-2' : ''">
                            <template x-if="field.kind === 'boolean'"><label class="flex items-center gap-3 min-h-11 px-3.5 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 cursor-pointer"><input type="checkbox" class="w-4 h-4 rounded text-brand-600" x-model="modal.form.data.type_fields[field.key]"><span class="text-sm font-medium text-gray-800 dark:text-gray-200" x-text="field.label"></span></label></template>
                            <template x-if="field.kind !== 'boolean'"><label class="block"><span class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5" x-text="field.label + (field.required ? ' *' : '')"></span>
                                <template x-if="field.kind === 'textarea'"><textarea class="ux-input w-full" rows="3" x-model="modal.form.data.type_fields[field.key]" :required="field.required"></textarea></template>
                                <template x-if="field.kind === 'select'"><select class="ux-input w-full" x-model="modal.form.data.type_fields[field.key]" :required="field.required"><option value="" x-text="window.ZenI18n.t('— wybierz —')"></option><template x-for="option in field.options" :key="option"><option :value="option" x-text="option"></option></template></select></template>
                                <template x-if="!['textarea','select'].includes(field.kind)"><input :type="field.kind" class="ux-input w-full" x-model="modal.form.data.type_fields[field.key]" :required="field.required"></template>
                            </label></template>
                        </div>
                    </template>
                </div>
            </div>

            <div x-show="['documents', 'offers'].includes(modal.view || currentView) && selectedTemplateFields().length" class="rounded-2xl border border-gray-200 dark:border-gray-700 bg-gray-50/70 dark:bg-gray-750 p-4 sm:p-5 space-y-3">
                <h4 class="text-sm font-bold text-gray-900 dark:text-gray-100" x-text="window.ZenI18n.t('Pola szablonu')">Pola szablonu</h4>
                <template x-for="field in selectedTemplateFields()" :key="field.name">
                    <label class="block text-sm"><span class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5" x-text="field.label"></span><input class="ux-input w-full" x-model="modal.form.data.custom[field.name]"></label>
                </template>
            </div>

            <!-- POLA WŁASNE (CUSTOM FIELDS) -->
            <div x-show="customFields && customFields.length > 0" x-cloak class="pt-4 border-t border-gray-200 dark:border-gray-700">
                <div class="flex items-center gap-2 mb-3">
                    <svg class="w-4 h-4 text-brand-600 dark:text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h10"/></svg>
                    <h4 class="text-xs font-bold text-gray-600 dark:text-gray-300 uppercase tracking-wider" x-text="window.ZenI18n.t('Pola własne')">Pola własne</h4>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <template x-for="cf in customFields" :key="'cf-input-' + cf.id">
                        <div :class="cf.kind === 'textarea' ? 'sm:col-span-2' : ''">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5"><span x-text="cf.label"></span><span x-show="cf.required" class="text-red-500 ml-1 font-bold">*</span></label>
                            <template x-if="cf.kind === 'text'">
                                <input type="text" x-model="modal.form['custom_' + cf.id]" :required="cf.required"
                                       class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
                            </template>
                            <template x-if="cf.kind === 'number'">
                                <input type="number" step="any" x-model="modal.form['custom_' + cf.id]" :required="cf.required"
                                       class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
                            </template>
                            <template x-if="cf.kind === 'date'">
                                <input type="date" x-model="modal.form['custom_' + cf.id]" :required="cf.required"
                                       class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
                            </template>
                            <template x-if="cf.kind === 'textarea'">
                                <textarea x-model="modal.form['custom_' + cf.id]" rows="3" :required="cf.required"
                                          class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none"></textarea>
                            </template>
                            <template x-if="cf.kind === 'boolean'">
                                <select x-model="modal.form['custom_' + cf.id]" :required="cf.required"
                                        class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 text-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
                                    <option value="" x-text="window.ZenI18n.t('— wybierz —')">— wybierz —</option>
                                    <option value="true" x-text="window.ZenI18n.t('Tak')">Tak</option>
                                    <option value="false" x-text="window.ZenI18n.t('Nie')">Nie</option>
                                </select>
                            </template>
                        </div>
                    </template>
                </div>
            </div>

            <!-- WIELU WYKONAWCÓW (tylko dla zadań) -->
            <div x-show="(modal.view || currentView) === 'tasks'" x-cloak class="pt-4 border-t border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between mb-3">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300">
                        <span x-text="window.ZenI18n.t('Wykonawcy zadania')">Wykonawcy zadania</span>
                    </label>
                    <span class="text-xs text-gray-400" x-text="(taskAssigneesUI || []).length + window.ZenI18n.t(&#x27; przypisanych&#x27;)"></span>
                </div>

                <div class="space-y-2 mb-3">
                    <template x-for="ta in taskAssigneesUI" :key="ta.user_id">
                        <div class="flex items-center gap-3 bg-gray-50/80 dark:bg-gray-750 p-2.5 rounded-xl border border-gray-200/80 dark:border-gray-700">
                            <template x-if="ta.user?.avatar_url">
                                <img :src="ta.user.avatar_url" class="w-8 h-8 rounded-full object-cover flex-shrink-0">
                            </template>
                            <template x-if="!ta.user?.avatar_url">
                                <div class="w-8 h-8 rounded-full avatar-gradient text-white flex items-center justify-center text-xs font-bold flex-shrink-0"
                                     x-text="initialsFrom(ta.user)"></div>
                            </template>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs font-semibold truncate text-gray-900 dark:text-gray-100" x-text="fullName(ta.user)"></p>
                                <input type="text" x-model="ta.comment" :placeholder="window.ZenI18n.t('komentarz/rola w zadaniu…')"
                                       class="w-full text-[11px] bg-transparent border-0 outline-none text-gray-500 dark:text-gray-400 p-0 mt-0.5 placeholder-gray-400">
                            </div>
                            <select :disabled="!canChangeTaskPerson(ta)" x-model="ta.status"
                                    class="text-xs px-2.5 py-1 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 text-gray-700 dark:text-gray-200 outline-none font-medium">
                                <option value="pending" x-text="window.ZenI18n.t('Oczekuje')">Oczekuje</option>
                                <option value="in_progress" x-text="window.ZenI18n.t('W toku')">W toku</option>
                                <option value="done" x-text="window.ZenI18n.t('Zrobione')">Zrobione</option>
                            </select>
                            <button x-show="canChangeTaskPerson(ta)" type="button" @click="taskAssigneesUI = taskAssigneesUI.filter(x => x.user_id !== ta.user_id)"
                                    class="w-6 h-6 rounded-lg text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-950/40 flex items-center justify-center text-sm font-bold transition">×</button>
                        </div>
                    </template>
                    <p x-show="taskAssigneesUI.length === 0" class="text-xs text-gray-400 italic py-1">
                        <span x-text="window.ZenI18n.t('Brak wykonawców. Dodaj osobę poniżej.')">Brak wykonawców. Dodaj osobę poniżej.</span>
                    </p>
                </div>

                <div class="user-select-wrap zen-person-picker" x-data="{ open: false, search: '' }" @click.outside="open = false" @keydown.escape.stop="open = false">
                    <button type="button" class="user-select-btn" @click="open = !open" :aria-expanded="open"><span class="zen-icon-wrap" x-html="zenIcon('user')" aria-hidden="true"></span> <span x-text="window.ZenI18n.t('Dodaj wykonawcę zadania')">Dodaj wykonawcę zadania</span></button>
                    <div x-show="open" x-cloak class="user-select-dropdown"><div class="user-select-search"><input type="search" x-model="search" :placeholder="window.ZenI18n.t('Szukaj osoby…')" :aria-label="window.ZenI18n.t('Szukaj osoby')"></div>
                    <template x-for="u in (users.filter(u => !taskAssigneesUI.some(a => a.user_id === u.id))).filter(u => fullName(u).toLocaleLowerCase(locale).includes(search.toLocaleLowerCase(locale)))" :key="u.id"><button type="button" class="user-select-option" @click="addTaskAssignee(u.id); open = false; search = ''"><span class="user-select-avatar"><template x-if="u.avatar_url"><img :src="u.avatar_url" alt=""></template><template x-if="!u.avatar_url"><span x-text="initialsFrom(u)"></span></template></span><span x-text="fullName(u)"></span></button></template>
                    </div>
                </div>
            </div>

            <!-- BŁĘDY -->
            <div x-show="modal.error" class="p-3.5 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 text-red-600 dark:text-red-400 text-xs font-medium" x-text="modal.error"></div>

            <!-- FOOTER -->
            <div class="flex items-center justify-between gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                <div>
                    <button type="button" x-show="modal.editingId && canRecordAction(modal.view || currentView, 'delete')" @click="archiveFromModal()"
                            class="px-3.5 py-2 rounded-xl border border-red-200 text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 text-xs font-semibold inline-flex items-center gap-1.5 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                        <span x-text="window.ZenI18n.t('Do archiwum')">Do archiwum</span>
                    </button>
                    <button type="button" x-show="modal.editingId && isAdmin" @click="permanentDeleteFromModal()"
                            class="ml-2 px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-semibold inline-flex items-center gap-1.5 transition shadow-2xs">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        <span x-text="window.ZenI18n.t('Usuń trwale')">Usuń trwale</span>
                    </button>
                </div>
                <div class="flex items-center gap-2.5">
                    <button type="button" @click="closeModal()"
                            class="px-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-xs font-semibold transition">
                        <span x-text="window.ZenI18n.t('Anuluj')">Anuluj</span>
                    </button>
                    <button type="submit" :disabled="savingRecord"
                            class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold inline-flex items-center gap-2 shadow-xs transition disabled:opacity-50">
                        <svg x-show="savingRecord" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        <svg x-show="!savingRecord" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        <span x-text="window.ZenI18n.t('Zapisz')">Zapisz</span>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
