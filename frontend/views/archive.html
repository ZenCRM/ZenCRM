<!-- ═══ ARCHIWUM ═══ -->
<div :inert="detailView.open && detailPanel" x-show="(!detailView.open || detailPanel) && currentView === 'archive'" x-cloak class="space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between flex-wrap gap-4">
        <div>
            <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                <span x-text="window.ZenI18n.t('Archiwum')">Archiwum</span>
            </h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" x-text="window.ZenI18n.t('Usunięte elementy w systemie (soft delete). Możesz przeglądać ich szczegóły, przywracać je do aktywnych lub usuwać bezpowrotnie.')">Usunięte elementy w systemie (soft delete). Możesz przeglądać ich szczegóły, przywracać je do aktywnych lub usuwać bezpowrotnie.</p>
        </div>
        <div class="flex items-center gap-3">
            <button type="button" @click="loadArchive()" :disabled="archiveLoading"
                    class="px-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center gap-2 transition shadow-sm">
                <span :class="archiveLoading ? 'animate-spin' : ''" x-html="zenIcon('activity')"></span>
                <span x-text="window.ZenI18n.t('Odśwież')">Odśwież</span>
            </button>
            <button type="button" x-show="isAdmin && archiveItems.length > 0" @click="emptyArchive()"
                    class="px-3.5 py-2 rounded-xl border border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-sm font-medium hover:bg-red-100 dark:hover:bg-red-900/50 flex items-center gap-2 transition">
                <span x-html="zenIcon('trash')"></span>
                <span x-text="window.ZenI18n.t('Opróżnij archiwum')">Opróżnij archiwum</span>
            </button>
        </div>
    </div>

    <!-- Filters & Search Bar -->
    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 flex-1">
            <div class="relative flex-1 sm:max-w-xs">
                <input type="text" x-model="archiveSearch"
                       :placeholder="window.ZenI18n.t('Szukaj w usuniętych...')"
                       class="w-full pl-3.5 pr-3 py-2 text-sm border rounded-xl dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <select x-model="archiveTypeFilter"
                    class="px-3.5 py-2 text-sm border rounded-xl dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
                <option value="" x-text="window.ZenI18n.t('Wszystkie typy')">Wszystkie typy</option>
                <option value="clients" x-text="window.ZenI18n.t('Klienci')">Klienci</option>
                <option value="leads" x-text="window.ZenI18n.t('Leady')">Leady</option>
                <option value="projects" x-text="window.ZenI18n.t('Projekty')">Projekty</option>
                <option value="contacts" x-text="window.ZenI18n.t('Kontakty')">Kontakty</option>
                <option value="tasks" x-text="window.ZenI18n.t('Zadania')">Zadania</option>
                <option value="meetings" x-text="window.ZenI18n.t('Spotkania')">Spotkania</option>
                <option value="services" x-text="window.ZenI18n.t('Usługi')">Usługi</option>
                <option value="service_catalog" x-text="window.ZenI18n.t('Katalog usług')">Katalog usług</option>
                <option value="offers" x-text="window.ZenI18n.t('Oferty')">Oferty</option>
                <option value="documents" x-text="window.ZenI18n.t('Dokumenty')">Dokumenty</option>
            </select>
        </div>
        <div class="flex items-center gap-2 self-end sm:self-center">
            <span class="text-xs px-3 py-1.5 rounded-full font-medium bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300"
                  x-text="window.ZenI18n.t('Liczba elementów: ') + filteredArchiveItems().length"></span>
        </div>
    </div>

    <!-- Data Table -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 dark:bg-gray-900/40 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-100 dark:border-gray-700">
                    <tr>
                        <th class="px-5 py-3.5" x-text="window.ZenI18n.t('Typ')">Typ</th>
                        <th class="px-5 py-3.5" x-text="window.ZenI18n.t('Nazwa / Element')">Nazwa / Element</th>
                        <th class="px-5 py-3.5" x-text="window.ZenI18n.t('Data usunięcia')">Data usunięcia</th>
                        <th class="px-5 py-3.5" x-text="window.ZenI18n.t('Usunięte przez')">Usunięte przez</th>
                        <th class="px-5 py-3.5 text-right" x-text="window.ZenI18n.t('Akcje')">Akcje</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 dark:divide-gray-700/60">
                    <template x-for="item in filteredArchiveItems()" :key="item._type + '-' + item.id">
                        <tr class="hover:bg-gray-50/60 dark:hover:bg-gray-700/30 transition">
                            <td class="px-5 py-3.5 whitespace-nowrap">
                                <span class="px-2.5 py-1 rounded-lg text-xs font-medium border"
                                      :class="archiveTypeBadgeClass(item._type)"
                                      x-text="archiveTypeLabel(item._type)"></span>
                            </td>
                            <td class="px-5 py-3.5">
                                <div class="font-semibold text-gray-900 dark:text-gray-100 truncate max-w-md"
                                     x-text="item._title || item.title || item.name || item.full_name || ('#' + item.id)"></div>
                                <div class="text-xs text-gray-400 truncate max-w-md mt-0.5"
                                     x-show="item._subtitle" x-text="item._subtitle"></div>
                            </td>
                            <td class="px-5 py-3.5 whitespace-nowrap text-gray-600 dark:text-gray-300 font-mono text-xs">
                                <span x-text="formatArchiveDate(item.deleted_at)"></span>
                            </td>
                            <td class="px-5 py-3.5 whitespace-nowrap">
                                <div class="flex items-center gap-2" x-show="item.deleted_by">
                                    <div class="w-6 h-6 rounded-full bg-brand-100 dark:bg-brand-900/50 text-brand-700 dark:text-brand-300 font-bold text-[10px] flex items-center justify-center overflow-hidden flex-shrink-0">
                                        <template x-if="item.deleted_by?.avatar_url">
                                            <img :src="item.deleted_by.avatar_url" class="w-full h-full object-cover">
                                        </template>
                                        <template x-if="!item.deleted_by?.avatar_url">
                                            <span x-text="(item.deleted_by?.name || '?').charAt(0).toUpperCase()"></span>
                                        </template>
                                    </div>
                                    <div class="text-xs font-medium text-gray-700 dark:text-gray-200 truncate max-w-[140px]"
                                         x-text="item.deleted_by?.name || item.deleted_by?.email"></div>
                                </div>
                                <span x-show="!item.deleted_by" class="text-xs text-gray-400 italic" x-text="window.ZenI18n.t('Nieznany / System')">Nieznany / System</span>
                            </td>
                            <td class="px-5 py-3.5 text-right whitespace-nowrap">
                                <div class="inline-flex items-center gap-1.5 justify-end">
                                    <!-- Podgląd -->
                                    <button type="button" @click="openArchivePreview(item)"
                                            class="zen-list-action text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300"
                                            :title="window.ZenI18n.t('Podgląd')"
                                            :aria-label="window.ZenI18n.t('Podgląd')">
                                        <span x-html="zenIcon('eye')" aria-hidden="true"></span>
                                    </button>
                                    <!-- Przywróć -->
                                    <button type="button" x-show="can('archive.restore')" @click="restoreItem(item)"
                                            class="zen-list-action zen-action-restore text-emerald-600 hover:text-emerald-800 dark:text-emerald-400 dark:hover:text-emerald-300"
                                            :title="window.ZenI18n.t('Przywróć')"
                                            :aria-label="window.ZenI18n.t('Przywróć')">
                                        <span x-html="zenIcon('restore')" aria-hidden="true"></span>
                                    </button>
                                    <!-- Usuń trwale (admin) -->
                                    <button type="button" x-show="isAdmin" @click="permanentDeleteItem(item)"
                                            class="zen-list-action zen-action-trash text-red-500 hover:text-red-700"
                                            :title="window.ZenI18n.t('Usuń trwale')"
                                            :aria-label="window.ZenI18n.t('Usuń trwale')">
                                        <span x-html="zenIcon('trash')" aria-hidden="true"></span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="!filteredArchiveItems().length">
                        <td colspan="5" class="text-center py-12 text-gray-400">
                            <div class="flex flex-col items-center justify-center gap-2">
                                <span class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-400 text-lg" x-html="zenIcon('document')"></span>
                                <p class="text-sm font-medium" x-text="window.ZenI18n.t('Archiwum jest puste')">Archiwum jest puste</p>
                                <p class="text-xs text-gray-400" x-text="window.ZenI18n.t('Brak usuniętych elementów spełniających kryteria.')">Brak usuniętych elementów spełniających kryteria.</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ═══ MODAL PODGLĄDU ZARCHIWIZOWANEGO ELEMENTU ═══ -->
<div x-show="archivePreviewModal.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4"
     @keydown.escape.window="closeArchivePreview()">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col border border-gray-200 dark:border-gray-700">
        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="px-2.5 py-1 rounded-lg text-xs font-semibold border"
                      :class="archiveTypeBadgeClass(archivePreviewModal.item?._type)"
                      x-text="archiveTypeLabel(archivePreviewModal.item?._type)"></span>
                <h3 class="text-base font-bold text-gray-900 dark:text-gray-100 truncate max-w-md"
                    x-text="archivePreviewModal.item?._title || ('#' + archivePreviewModal.item?.id)"></h3>
            </div>
            <button type="button" @click="closeArchivePreview()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-2xl leading-none">&times;</button>
        </div>

        <!-- Modal Info Banner -->
        <div class="px-6 py-3 bg-amber-50 dark:bg-amber-900/20 border-b border-amber-100 dark:border-amber-900/40 flex items-center justify-between text-xs text-amber-800 dark:text-amber-200">
            <div class="flex items-center gap-2">
                <span x-html="zenIcon('trash')" class="w-4 h-4 text-amber-600"></span>
                <span>
                    <span class="font-semibold" x-text="window.ZenI18n.t('Usunięto: ')">Usunięto: </span>
                    <span x-text="formatArchiveDate(archivePreviewModal.item?.deleted_at)"></span>
                    <span x-show="archivePreviewModal.item?.deleted_by">
                        &bull; <span class="font-semibold" x-text="window.ZenI18n.t('przez: ')">przez: </span>
                        <span x-text="archivePreviewModal.item?.deleted_by?.name || archivePreviewModal.item?.deleted_by?.email"></span>
                    </span>
                </span>
            </div>
            <span class="px-2 py-0.5 rounded font-mono bg-amber-100 dark:bg-amber-800/50 text-amber-900 dark:text-amber-100"
                  x-text="'ID: ' + (archivePreviewModal.item?.id || '—')"></span>
        </div>

        <!-- Modal Body Details -->
        <div class="p-6 overflow-y-auto space-y-4 flex-1">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <template x-for="(val, key) in (archivePreviewModal.item || {})" :key="key">
                    <div x-show="!['_type', '_type_singular', '_title', '_subtitle', 'deleted_by', 'deleted_at'].includes(key) && val !== null && val !== ''"
                         class="p-3 rounded-xl border border-gray-100 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-700/30">
                        <span class="block text-[11px] font-semibold text-gray-400 uppercase tracking-wider" x-text="key"></span>
                        <span class="block text-sm text-gray-800 dark:text-gray-200 mt-0.5 break-words font-medium"
                              x-text="typeof val === 'object' ? JSON.stringify(val) : String(val)"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/30 flex items-center justify-between">
            <div>
                <button type="button" x-show="isAdmin" @click="permanentDeleteItem(archivePreviewModal.item)"
                        class="px-4 py-2 rounded-xl border border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-sm font-medium hover:bg-red-100 dark:hover:bg-red-900/50 transition">
                    <span x-text="window.ZenI18n.t('Usuń trwale')">Usuń trwale</span>
                </button>
            </div>
            <div class="flex items-center gap-3">
                <button type="button" @click="closeArchivePreview()"
                        class="px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <span x-text="window.ZenI18n.t('Zamknij')">Zamknij</span>
                </button>
                <button type="button" x-show="can('archive.restore')" @click="restoreItem(archivePreviewModal.item)"
                        class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-sm transition flex items-center gap-2">
                    <span x-html="zenIcon('restore')"></span>
                    <span x-text="window.ZenI18n.t('Przywróć ten element')">Przywróć ten element</span>
                </button>
            </div>
        </div>
    </div>
</div>
