<div class="plugin-report-studio">
    <p class="plugin-report-intro" x-text="window.ZenI18n.t('Zamień dane CRM w czytelny raport. Wybierz dane, okres i sposób grupowania.')"></p>
    <form class="plugin-report-form" @submit.prevent="generate()">
        <div class="plugin-report-presets"><span x-text="window.ZenI18n.t('Szybki okres')"></span><button type="button" @click="preset('30')" x-text="window.ZenI18n.t('Ostatnie 30 dni')"></button><button type="button" @click="preset('month')" x-text="window.ZenI18n.t('Bieżący miesiąc')"></button><button type="button" @click="preset('all')" x-text="window.ZenI18n.t('Cały okres')"></button></div>
        <div class="plugin-report-fields">
            <label><span x-text="window.ZenI18n.t('Dane')"></span><select x-model="entity" @change="datasetChanged()"><option value="tasks" x-text="window.ZenI18n.t('Zadania')"></option><option value="clients" x-text="window.ZenI18n.t('Klienci')"></option></select></label>
            <label><span x-text="window.ZenI18n.t('Grupowanie')"></span><select x-model="groupBy"><option value="status" x-text="window.ZenI18n.t('Status')"></option><template x-if="entity === 'tasks'"><option value="priority" x-text="window.ZenI18n.t('Priorytet')"></option></template></select></label>
            <label><span x-text="window.ZenI18n.t('Data od')"></span><input type="date" min="1900-01-01" max="9998-12-31" x-model="dateFrom" :max="dateTo || '9998-12-31'"></label>
            <label><span x-text="window.ZenI18n.t('Data do')"></span><input type="date" max="9998-12-31" x-model="dateTo" :min="dateFrom || '1900-01-01'"></label>
            <label><span x-text="window.ZenI18n.t('Status (opcjonalnie)')"></span><input type="text" maxlength="20" x-model="statusFilter" :placeholder="entity === 'tasks' ? 'todo, in_progress, done' : 'active, inactive'"></label>
            <label class="plugin-report-check" x-show="entity === 'tasks'"><input type="checkbox" x-model="overdueOnly"><span x-text="window.ZenI18n.t('Tylko zaległe zadania')"></span></label>
        </div>
        <div class="plugin-report-actions"><p x-text="window.ZenI18n.t('Okres dotyczy daty utworzenia rekordów (UTC). Puste daty oznaczają cały okres.')"></p><button type="submit" class="plugin-button plugin-primary" :disabled="busy" x-text="window.ZenI18n.t(busy ? 'Generowanie raportu…' : 'Generuj raport')"></button></div>
    </form>
    <p role="alert" class="text-red-600 mt-3" x-show="reportError" x-text="reportError"></p>
    <p role="status" class="plugin-report-note" x-show="busy" x-text="window.ZenI18n.t('Generowanie raportu…')"></p>
    <template x-if="report"><div class="plugin-report-result" aria-live="polite">
        <div class="plugin-report-result-head"><div><h4 x-text="window.ZenI18n.t(report.entity === 'tasks' ? 'Raport zadań' : 'Raport klientów')"></h4><p><span x-text="reportPeriod()"></span> · <span x-text="window.ZenI18n.t(report.group_by === 'priority' ? 'Priorytet' : 'Status')"></span><span x-show="report.status" x-text="' · ' + report.status"></span><span x-show="report.overdue_only" x-text="' · ' + window.ZenI18n.t('Tylko zaległe zadania')"></span></p></div><button type="button" class="plugin-button" @click="exportCSV()" :disabled="!report.total" x-text="window.ZenI18n.t('Eksport CSV')"></button></div>
        <div class="plugin-report-stats"><div><span x-text="window.ZenI18n.t('Liczba rekordów')"></span><strong x-text="report.total"></strong></div><template x-if="report.entity === 'tasks'"><div><span x-text="window.ZenI18n.t('Otwarte zadania')"></span><strong x-text="report.metrics.open"></strong></div></template><template x-if="report.entity === 'tasks'"><div><span x-text="window.ZenI18n.t('Ukończone')"></span><strong x-text="report.metrics.done"></strong></div></template><template x-if="report.entity === 'tasks'"><div class="plugin-report-overdue"><span x-text="window.ZenI18n.t('Zaległe zadania')"></span><strong x-text="report.metrics.overdue"></strong></div></template></div>
        <p x-show="!report.total" class="plugin-report-note" x-text="window.ZenI18n.t('Brak danych dla wybranych filtrów.')"></p>
        <div class="plugin-report-table-wrap" x-show="report.total"><table class="plugin-report-table"><thead><tr><th scope="col" x-text="window.ZenI18n.t('Grupa')"></th><th scope="col" x-text="window.ZenI18n.t('Liczba rekordów')"></th><th scope="col" x-text="window.ZenI18n.t('Udział (%)')"></th></tr></thead><tbody><template x-for="(row, index) in report.rows" :key="index"><tr><td><span x-text="rowLabel(row)"></span><div class="plugin-report-bar" aria-hidden="true"><span :style="'width:' + Math.max(0, Math.min(100, row.percent)) + '%' "></span></div></td><td x-text="row.count"></td><td x-text="row.percent + '%'"></td></tr></template></tbody></table></div>
        <p class="plugin-report-note"><span x-text="window.ZenI18n.t('Wygenerowano (UTC)')"></span>: <time :datetime="report.generated_at" x-text="report.generated_at.replace('T', ' ').replace('Z', '')"></time></p>
    </div></template>
    <p class="plugin-report-note" x-text="window.ZenI18n.t('Raport zawiera tylko rekordy dostępne dla Ciebie. Dane pozostają w CRM; eksportujesz wyłącznie podsumowanie.')"></p>
</div>
