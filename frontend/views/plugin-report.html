<div class="plugin-report-studio">
    <p class="plugin-report-intro" x-text="window.ZenI18n.t('Zamień dane CRM w czytelny raport. Wybierz dane, okres i sposób grupowania.')"></p>
    <form class="plugin-report-form" @submit.prevent="generate()">
        <div class="plugin-report-presets"><span x-text="window.ZenI18n.t('Szybki okres')"></span><button type="button" @click="preset('30')" x-text="window.ZenI18n.t('Ostatnie 30 dni')"></button><button type="button" @click="preset('month')" x-text="window.ZenI18n.t('Bieżący miesiąc')"></button><button type="button" @click="preset('all')" x-text="window.ZenI18n.t('Cały okres')"></button></div>
        <div class="plugin-report-fields">
            <label><span x-text="window.ZenI18n.t('Dane')"></span><select x-model="entity" @change="datasetChanged()"><template x-for="source in sourceOptions()" :key="source"><option :value="source" x-text="sourceLabel(source)"></option></template></select></label>
            <label><span x-text="window.ZenI18n.t('Grupowanie')"></span><select x-model="groupBy"><template x-for="group in groups()" :key="group"><option :value="group" x-text="fieldLabel(group)"></option></template></select></label>
            <label><span x-text="window.ZenI18n.t('Pole daty')"></span><select x-model="dateField"><template x-for="field in dates()" :key="field"><option :value="field" x-text="fieldLabel(field)"></option></template></select></label>
            <label><span x-text="window.ZenI18n.t('Data od')"></span><input type="date" min="1900-01-01" max="9998-12-31" x-model="dateFrom" :max="dateTo || '9998-12-31'"></label>
            <label><span x-text="window.ZenI18n.t('Data do')"></span><input type="date" max="9998-12-31" x-model="dateTo" :min="dateFrom || '1900-01-01'"></label>
            <label><span x-text="window.ZenI18n.t('Status (opcjonalnie)')"></span><input type="text" maxlength="30" x-model="statusFilter" :placeholder="window.ZenI18n.t('Identyfikator statusu lub etapu')"></label>
            <label class="plugin-report-check" x-show="allowsOverdue()"><input type="checkbox" x-model="overdueOnly"><span x-text="window.ZenI18n.t('Tylko zaległe')"></span></label>
            <label class="plugin-report-check"><input type="checkbox" x-model="comparePrevious" :disabled="!dateFrom || !dateTo"><span x-text="window.ZenI18n.t('Porównaj z poprzednim okresem')"></span></label>
            <label x-show="allowsAmount()"><span x-text="window.ZenI18n.t('Wartość od')"></span><input type="number" step="0.01" x-model="amountMin"></label>
            <label x-show="allowsAmount()"><span x-text="window.ZenI18n.t('Wartość do')"></span><input type="number" step="0.01" x-model="amountMax"></label>
        </div>
        <div class="plugin-report-actions"><p x-text="window.ZenI18n.t('Okres dotyczy wybranego pola daty (UTC). Puste daty oznaczają cały okres.')"></p><button type="submit" class="plugin-button plugin-primary" :disabled="busy" x-text="window.ZenI18n.t(busy ? 'Generowanie raportu…' : 'Generuj raport')"></button></div>
    </form>
    <p role="alert" class="text-red-600 mt-3" x-show="reportError" x-text="reportError"></p>
    <p role="status" class="plugin-report-note" x-show="busy" x-text="window.ZenI18n.t('Generowanie raportu…')"></p>
    <template x-if="report"><div class="plugin-report-result" aria-live="polite">
        <div class="plugin-report-result-head"><div><h4 x-text="window.ZenI18n.t('Raport') + ' · ' + sourceLabel(report.entity)"></h4><p><span x-text="reportPeriod()"></span> · <span x-text="fieldLabel(report.date_field || 'created_at')"></span> · <span x-text="fieldLabel(report.group_by)"></span><span x-show="report.status" x-text="' · ' + report.status"></span><span x-show="report.overdue_only" x-text="' · ' + window.ZenI18n.t('Tylko zaległe')"></span></p></div><div class="plugin-report-export"><button type="button" class="plugin-button" @click="saveToDrive()" :disabled="driveBusy || busy || !report.total" x-text="window.ZenI18n.t('Zapisz na Dysku Google')"></button><button type="button" class="plugin-button" @click="exportCSV()" :disabled="!report.total" x-text="window.ZenI18n.t('Eksport CSV')"></button></div></div>
        <div class="plugin-report-stats"><div><span x-text="window.ZenI18n.t('Liczba rekordów')"></span><strong x-text="report.total"></strong></div><template x-if="report.metrics.open !== undefined"><div><span x-text="window.ZenI18n.t('Otwarte')"></span><strong x-text="report.metrics.open"></strong></div></template><template x-if="report.metrics.done !== undefined"><div><span x-text="window.ZenI18n.t('Zakończone')"></span><strong x-text="report.metrics.done"></strong></div></template><template x-if="report.metrics.overdue !== undefined"><div class="plugin-report-overdue"><span x-text="window.ZenI18n.t('Zaległe')"></span><strong x-text="report.metrics.overdue"></strong></div></template><template x-if="report.metrics.amount !== undefined"><div><span x-text="window.ZenI18n.t('Wartość nominalna')"></span><strong x-text="report.metrics.amount"></strong></div></template></div>
        <template x-if="report.comparison"><div class="plugin-report-comparison"><div><span x-text="window.ZenI18n.t('Poprzedni okres')"></span><p x-text="report.comparison.date_from + ' — ' + report.comparison.date_to"></p><strong x-text="report.comparison.total"></strong></div><div><span x-text="window.ZenI18n.t('Zmiana liczby rekordów')"></span><strong x-text="(report.comparison.change > 0 ? '+' : '') + report.comparison.change"></strong><p x-text="report.comparison.change_percent === null ? window.ZenI18n.t('Brak bazy do porównania procentowego') : report.comparison.change_percent + '%'"></p></div></div></template>
        <p x-show="report.metrics.amount !== undefined" class="plugin-report-note" x-text="window.ZenI18n.t('Wartość nominalna to suma wartości leadów, kwot ofert, budżetów projektów lub cen usług. Nie oznacza przychodu ani sumy faktur.')"></p>
        <p x-show="driveResult" class="plugin-drive-message"><a :href="window.ZenDrive.safeURL(driveResult?.url)" target="_blank" rel="noopener noreferrer" x-text="window.ZenI18n.t('Raport zapisano na Dysku Google. Otwórz plik.')"></a></p>
        <p x-show="!report.total" class="plugin-report-note" x-text="window.ZenI18n.t('Brak danych dla wybranych filtrów.')"></p>
        <div class="plugin-report-table-wrap" x-show="report.total"><table class="plugin-report-table"><thead><tr><th scope="col" x-text="window.ZenI18n.t('Grupa')"></th><th scope="col" x-text="window.ZenI18n.t('Liczba rekordów')"></th><th scope="col" x-text="window.ZenI18n.t('Udział (%)')"></th><th scope="col" x-show="report.metrics.amount !== undefined" x-text="window.ZenI18n.t('Wartość nominalna')"></th></tr></thead><tbody><template x-for="(row, index) in report.rows" :key="index"><tr><td><span x-text="rowLabel(row)"></span><div class="plugin-report-bar" aria-hidden="true"><span :style="'width:' + Math.max(0, Math.min(100, row.percent)) + '%' "></span></div></td><td x-text="row.count"></td><td x-text="row.percent + '%'"></td><td x-show="report.metrics.amount !== undefined" x-text="row.amount"></td></tr></template></tbody></table></div>
        <p class="plugin-report-note"><span x-text="window.ZenI18n.t('Wygenerowano (UTC)')"></span>: <time :datetime="report.generated_at" x-text="report.generated_at.replace('T', ' ').replace('Z', '')"></time></p>
    </div></template>
    <p class="plugin-report-note" x-text="window.ZenI18n.t('Aby zapisać raport na Dysku Google, dodaj integrację Google Drive w sklepie i połącz konto.')"></p>
    <p class="plugin-report-note" x-text="window.ZenI18n.t('Raport zawiera tylko rekordy dostępne dla Ciebie. Dane pozostają w CRM; eksportujesz wyłącznie podsumowanie.')"></p>
</div>
