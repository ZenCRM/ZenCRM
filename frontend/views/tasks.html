<!-- ═══ ZADANIA – TABELA ═══ -->
            <div :inert="detailView.open &amp;&amp; detailPanel" x-show="(!detailView.open || detailPanel) &amp;&amp; currentView === 'tasks'" x-init="$watch('tasks', list => { loadAllCustomFields(); loadCustomValuesForTable('tasks', (list||[]).map(t => t.id)); }); loadAllCustomFields(); if (tasks.length) loadCustomValuesForTable('tasks', tasks.map(t => t.id));" x-cloak class="space-y-4">
                <div class="flex flex-wrap justify-between items-center gap-3"><h1 class="text-xl font-bold" x-text="window.ZenI18n.t('Zadania')">Zadania</h1><div class="flex flex-wrap items-center gap-3"><button type="button" @click="editTaskStages()" class="zen-task-status-link"><span class="zen-icon-wrap" x-html="zenIcon('settings')" aria-hidden="true"></span><span x-text="window.ZenI18n.t('Ustaw statusy')">Ustaw statusy</span></button><button type="button" x-show="canRecordAction('tasks', 'create')" @click="openModal(null, null, false, 'tasks')" class="ux-button" x-text="window.ZenI18n.t('+ Dodaj zadanie')">+ Dodaj zadanie</button></div></div>
                <div class="zen-task-summary zen-task-summary--dynamic"><button class="zen-task-summary-tile" @click="taskFilter = ''" :aria-pressed="taskFilter === ''"><span class="zen-icon-wrap" x-html="zenIcon('calendar')" aria-hidden="true"></span><span x-text="window.ZenI18n.t('Wszystkie zadania')">Wszystkie zadania</span><strong x-text="(tasks || []).length"></strong></button><template x-for="stage in taskStatusStages" :key="'summary-' + stage.id"><button class="zen-task-summary-tile" :style="{backgroundColor: stage.accent}" @click="taskFilter = stage.id" :aria-pressed="taskFilter === stage.id"><span class="zen-icon-wrap" x-html="zenIcon(stage.id === 'done' ? 'check' : 'flag')" aria-hidden="true"></span><span x-text="stage.label"></span><strong x-text="(tasks || []).filter(task => task.status === stage.id).length"></strong></button></template></div>

                    <div class="flex items-center gap-2 flex-1 flex-wrap">
                        <input class="ux-input" type="search" x-model.debounce.150ms="taskSearch" :placeholder="window.ZenI18n.t('Szukaj zadania')" :aria-label="window.ZenI18n.t('Szukaj zadania')">
                        <select class="ux-input" x-model="taskScope" :aria-label="window.ZenI18n.t('Widok zadań')">

                            <option value="mine" x-text="window.ZenI18n.t('Moje zadania')">Moje zadania</option>
                            <option value="today" x-text="window.ZenI18n.t('Dzisiaj')">Dzisiaj</option>
                            <option value="overdue" x-text="window.ZenI18n.t('Zaległe')">Zaległe</option>
                            <option value="upcoming" x-text="window.ZenI18n.t('Nadchodzące')">Nadchodzące</option>
                            <option value="undated" x-text="window.ZenI18n.t('Bez terminu')">Bez terminu</option>
                        </select>
                        <span class="ux-muted text-xs" x-text="visibleTasks.length + window.ZenI18n.t(' zadań')"></span>
                    </div>

                    <div class="flex items-center gap-2">
                        <!-- Przełącznik Tabela / Kanban -->
                        <div class="inline-flex rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-gray-800 p-0.5 text-xs">
                            <button type="button" @click="taskViewMode = 'table'; localStorage.setItem('taskViewMode', 'table')"
                                    :class="taskViewMode === 'table' ? 'bg-white dark:bg-gray-700 text-brand-600 dark:text-brand-400 font-semibold shadow-xs' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200'"
                                    class="px-2.5 py-1.5 rounded-md flex items-center gap-1.5 transition cursor-pointer">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                                <span x-text="window.ZenI18n.t('Tabela')">Tabela</span>
                            </button>
                            <button type="button" @click="taskViewMode = 'kanban'; localStorage.setItem('taskViewMode', 'kanban')"
                                    :class="taskViewMode === 'kanban' ? 'bg-white dark:bg-gray-700 text-brand-600 dark:text-brand-400 font-semibold shadow-xs' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200'"
                                    class="px-2.5 py-1.5 rounded-md flex items-center gap-1.5 transition cursor-pointer">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2m8 4v6m0 0a2 2 0 01-2 2h-2a2 2 0 01-2-2v-6a2 2 0 012-2h2a2 2 0 012 2m0-6V7a2 2 0 00-2-2h-2a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2z"/></svg>
                                <span x-text="window.ZenI18n.t('Kanban')">Kanban</span>
                            </button>
                        </div>

                        <!-- Column picker for tasks (widoczny w widoku tabeli) -->
                        <div x-show="taskViewMode === 'table'" class="relative inline-block text-left" @click.outside="if (columnPickerOpen === 'tasks') columnPickerOpen = null">
                            <button type="button" @click="columnPickerOpen = (columnPickerOpen === 'tasks' ? null : 'tasks')"
                                    class="px-3 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 text-xs font-medium rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center gap-1.5 shadow-xs cursor-pointer">
                                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                                <span x-text="window.ZenI18n.t('Dostosuj kolumny')">Dostosuj kolumny</span>
                            </button>
                            <div x-show="columnPickerOpen === 'tasks'" x-cloak class="absolute right-0 mt-2 w-64 bg-white dark:bg-gray-800 rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 py-2 z-50 text-xs">
                                <div class="px-3 py-1.5 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between">
                                    <span class="font-bold text-gray-700 dark:text-gray-300" x-text="window.ZenI18n.t('Widoczne kolumny')">Widoczne kolumny</span>
                                    <button type="button" @click="resetColumns('tasks')" class="text-brand-600 dark:text-brand-400 hover:underline text-[11px]" x-text="window.ZenI18n.t('Resetuj')">Resetuj</button>
                                </div>
                                <div class="max-h-60 overflow-y-auto px-3 py-2 space-y-1.5">
                                    <template x-for="col in availableColumns('tasks')" :key="'col-tasks-' + col.key">
                                        <label class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50 p-1 rounded">
                                            <input type="checkbox" :checked="isColumnVisible('tasks', col.key)" @change="toggleColumn('tasks', col.key)" class="rounded text-brand-600 focus:ring-brand-500 w-3.5 h-3.5">
                                            <span class="text-gray-700 dark:text-gray-200" x-text="col.label"></span>
                                            <span x-show="col.isCustom" class="text-[10px] text-brand-600 dark:text-brand-400 ml-auto font-medium">(pole)</span>
                                        </label>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 flex-wrap">
                    <button @click="taskFilter = ''"
                            :class="taskFilter === '' ? 'bg-brand-600 text-white' : 'bg-white dark:bg-gray-800'"
                            class="px-3 py-1.5 rounded-lg text-sm border border-gray-200 dark:border-gray-600 font-medium">
                        <span x-text="window.ZenI18n.t('Wszystkie')">Wszystkie</span>
                    </button>
                    <template x-for="stage in taskStatusStages" :key="'filter-' + stage.id">
                        <button @click="taskFilter = stage.id" :style="taskFilter === stage.id ? {backgroundColor: stage.accent, borderColor: stage.accent, color: '#fff'} : {}"
                                class="px-3 py-1.5 rounded-lg text-sm border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 font-medium">
                            <span x-text="stage.label"></span>
                        </button>
                    </template>
                </div>

                <!-- Tabela -->
                <div x-show="taskViewMode === 'table'" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm overflow-hidden border border-gray-100 dark:border-gray-700">
                    <div class="overflow-x-auto">
                        <table class="svc-table">
                            <thead>
                                <tr>
                                    <th style="width: 35%;" x-show="isColumnVisible('tasks', 'title')"><span x-text="window.ZenI18n.t('Zadanie')">Zadanie</span></th>
                                    <th x-show="isColumnVisible('tasks', 'status')"><span x-text="window.ZenI18n.t('Status')">Status</span></th>
                                    <th x-show="isColumnVisible('tasks', 'priority')"><span x-text="window.ZenI18n.t('Priorytet')">Priorytet</span></th>
                                    <th x-show="isColumnVisible('tasks', 'due_date')"><span x-text="window.ZenI18n.t('Termin')">Termin</span></th>
                                    <th x-show="isColumnVisible('tasks', 'context')"><span x-text="window.ZenI18n.t('Klient / kontekst')">Klient / kontekst</span></th>
                                    <th x-show="isColumnVisible('tasks', 'assignees')"><span x-text="window.ZenI18n.t('Wykonawcy')">Wykonawcy</span></th>
                                    <template x-for="col in (availableColumns('tasks').filter(c => c.isCustom))" :key="'th-cf-tasks-' + col.key">
                                        <th x-show="isColumnVisible('tasks', col.key)" x-text="col.label"></th>
                                    </template>
                                    <th class="text-right" x-show="isColumnVisible('tasks', 'actions')"><span x-text="window.ZenI18n.t('Akcje')">Akcje</span></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="t in pagedItems('tasks', visibleTasks)" :key="t.id">
                                    <tr class="task-row" :class="{ 'ux-overdue': isOverdue(t) }" @click="openDetail('task', t.id)">
                                        <td x-show="isColumnVisible('tasks', 'title')">
                                            <div class="font-semibold text-gray-900 dark:text-gray-100" 
                                                 :class="t.status === 'done' ? 'line-through text-gray-400' : ''"
                                                 x-text="t.title"></div>
                                            <div class="text-xs text-gray-500 mt-0.5 truncate" x-show="t.description"
                                                 x-text="t.description"></div>
                                            <div class="zen-list-progress" x-show="(t.assignees || []).length || t.status === 'done'">
                                                <div class="wm-progress zen-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="taskProgress(t)"><div class="wm-progress-fill" :style="'width:' + taskProgress(t) + '%'"></div></div>
                                                <span x-text="taskProgress(t) + '%'"></span>
                                            </div>
                                        </td>
                                        <td x-show="isColumnVisible('tasks', 'status')">
                                            <span class="px-2 py-0.5 text-xs font-semibold rounded-full" :style="{backgroundColor: taskStageColor(t.status) + '20', color: taskStageColor(t.status)}"
                                                  :class="{
                                                    'bg-gray-100 text-gray-700': t.status === 'todo',
                                                    'bg-yellow-100 text-yellow-700': t.status === 'in_progress',
                                                    'bg-green-100 text-green-700': t.status === 'done'
                                                  }"
                                                  x-text="taskStageLabel(t.status)"></span>
                                        </td>
                                        <td x-show="isColumnVisible('tasks', 'priority')">
                                            <span class="px-2 py-0.5 text-xs font-semibold rounded-full"
                                                  :class="{
                                                    'bg-red-100 text-red-700': t.priority === 'high',
                                                    'bg-yellow-100 text-yellow-700': t.priority === 'medium',
                                                    'bg-green-100 text-green-700': t.priority === 'low'
                                                  }"
                                                  x-text="priorityLabel(t.priority)"></span>
                                        </td>
                                        <td @click.stop x-show="isColumnVisible('tasks', 'due_date')"><input type="date" class="ux-input ux-date" :value="t.due_date?.slice(0,10) || ''" :disabled="!!savingTask" :aria-label="window.ZenI18n.t('Termin zadania')" @change="await patchTask(t, { due_date: $event.target.value ? $event.target.value + 'T' + (t.due_date?.slice(11,19) || '17:00:00') : null }); $event.target.value = t.due_date?.slice(0,10) || ''"><span class="ux-overdue-label" x-show="isOverdue(t)"><span x-text="window.ZenI18n.t('Po terminie')">Po terminie</span></span></td>
                                        <td class="text-xs" x-show="isColumnVisible('tasks', 'context')">
                                            <button x-show="t.client_id" @click.stop="openDetail('client', t.client_id)" class="ux-text-button" x-text="clientName(t.client_id)"></button>
                                            <button x-show="t.service_id" @click.stop="openDetail('service', t.service_id)" class="ux-text-button" x-text="services.find(s =&gt; s.id === t.service_id)?.name || ('Usługa #' + t.service_id)"></button>
                                            <button x-show="t.lead_id" @click.stop="openDetail('lead', t.lead_id)" class="ux-text-button" x-text="leads.find(l =&gt; l.id === t.lead_id)?.title || ('Lead #' + t.lead_id)"></button>
                                            <span x-show="!t.client_id &amp;&amp; !t.service_id &amp;&amp; !t.lead_id" class="text-gray-400">—</span>
                                        </td>
                                        <td x-show="isColumnVisible('tasks', 'assignees')">
                                            <div class="flex -space-x-1">
                                                <template x-for="ta in (t.assignees || []).slice(0,3)" :key="ta.id">
                                                    <div :title="fullName(ta.user)">
                                                        <template x-if="ta.user?.avatar_url">
                                                            <img :src="ta.user.avatar_url" class="w-6 h-6 rounded-full object-cover border-2 border-white dark:border-gray-800">
                                                        </template>
                                                        <template x-if="!ta.user?.avatar_url">
                                                            <div class="w-6 h-6 rounded-full avatar-gradient text-white flex items-center justify-center text-[9px] font-bold border-2 border-white dark:border-gray-800"
                                                                 x-text="initialsFrom(ta.user)"></div>
                                                        </template>
                                                    </div>
                                                </template>
                                                <span x-show="!(t.assignees || []).length" class="text-xs text-gray-400">—</span>
                                                <span x-show="(t.assignees || []).length &gt; 3"
                                                      class="text-xs text-gray-500 ml-2 self-center"
                                                      x-text="'+' + ((t.assignees || []).length - 3)"></span>
                                            </div>
                                        </td>
                                        <template x-for="col in (availableColumns('tasks').filter(c => c.isCustom))" :key="'td-cf-tasks-' + col.key">
                                            <td class="text-xs text-gray-600 dark:text-gray-300" x-show="isColumnVisible('tasks', col.key)" x-text="getCustomFieldValue('tasks', t.id, col.field.id)"></td>
                                        </template>
                                        <td class="text-right whitespace-nowrap" @click.stop x-show="isColumnVisible('tasks', 'actions')">
                                            <button x-show="!(t.assignees || []).length" @click="patchTask(t, { status: t.status === 'done' ? 'todo' : 'done' })" :disabled="!!savingTask" class="zen-list-action" :aria-label="t.status === 'done' ? window.ZenI18n.t('Wznów') : window.ZenI18n.t('Zakończ')" :title="t.status === 'done' ? window.ZenI18n.t('Wznów') : window.ZenI18n.t('Zakończ')"><span class="zen-icon-wrap" x-html="zenIcon(t.status === 'done' ? 'restore' : 'check')" aria-hidden="true"></span></button><button @click="openDetail('task', t.id)" class="zen-list-action zen-action-arrow" :aria-label="window.ZenI18n.t('Otwórz')" :title="window.ZenI18n.t('Otwórz')"><span x-html="zenIcon('arrow')" aria-hidden="true"></span></button>
                                            <button @click="openModal(t, null, false, 'tasks')" class="zen-list-action zen-action-edit" :aria-label="window.ZenI18n.t('Edytuj')" :title="window.ZenI18n.t('Edytuj')"><span x-html="zenIcon('edit')" aria-hidden="true"></span></button>
                                            <button @click="remove(t.id)" class="zen-list-action zen-action-trash" :aria-label="window.ZenI18n.t('Usuń')" :title="window.ZenI18n.t('Usuń')"><span x-html="zenIcon('trash')" aria-hidden="true"></span></button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <div x-show="visibleTasks.length === 0" class="detail-empty">
                        <p class="font-medium" x-text="listError ? window.ZenI18n.t('Nie udało się pobrać zadań') : window.ZenI18n.t('Brak zadań w tym widoku')"></p><button class="ux-text-button" x-show="taskScope || taskFilter || taskSearch" @click="taskScope = ''; taskFilter = ''; taskSearch = '';"><span x-text="window.ZenI18n.t(&quot;Wyczyść filtry&quot;)">Wyczyść filtry</span></button>
                    </div>
                    <div x-data="{ pagerView: 'tasks', get pagerItems() { return this.visibleTasks } }"><% include "views/pagination.html" %></div>
                </div>

                <!-- Kanban Board dla zadań ogólnych -->
                <div x-show="taskViewMode === 'kanban'" class="kanban-board">
                    <div class="kanban-viewport">
                        <div class="kanban-cols" :style="{ '--board-columns': (taskFilter ? 1 : Math.min(taskBoardStages.length, 5)) }" tabindex="0">
                            <template x-for="st in taskBoardStages.filter(s => !taskFilter || taskFilter === s.id)" :key="'task-col-' + st.id">
                                <div class="kanban-col-new" :data-stage="st.id"
                                     :style="{ '--stage-accent': st.accent, '--stage-tint': st.accent + '12' }"
                                     :class="{ dragover: dragOverTaskStatus === st.id }"
                                     @dragenter.prevent="if (draggedTask) dragOverTaskStatus = st.id"
                                     @dragover.prevent="if (draggedTask) dragOverTaskStatus = st.id"
                                     @dragleave="if (dragOverTaskStatus === st.id) dragOverTaskStatus = null"
                                     @drop.prevent.stop="moveTaskToStatus($event, st.id)">
                                    
                                    <div class="kanban-col-header">
                                        <div class="title flex items-center justify-between w-full">
                                            <div class="flex items-center gap-2">
                                                <span class="zen-stage-dot" :style="{ backgroundColor: st.accent }" aria-hidden="true"></span>
                                                <span class="font-bold text-sm" x-text="st.label"></span>
                                                <span class="count" x-text="(visibleTasks || []).filter(t => t.status === st.id).length"></span>
                                            </div>
                                            <button :aria-label="window.ZenI18n.t('Dodaj zadanie') + ': ' + st.label"
                                                    x-show="taskStatusStages.some(stage => stage.id === st.id)"
                                                    class="kanban-col-add cursor-pointer" @click="openModal(null, null, false, 'tasks'); $nextTick(() => { modal.form.status = st.id; });">+</button>
                                        </div>
                                    </div>

                                    <div class="kanban-col-body">
                                        <template x-for="task in (visibleTasks || []).filter(t => t.status === st.id)" :key="'k-task-' + task.id">
                                            <div class="kanban-card-new"
                                                 draggable="true"
                                                 @dragstart.stop="startTaskDrag($event, task)"
                                                 @dragend="endTaskDrag()"
                                                 :class="{ 'ux-card-dragged': draggedTask?.id === task.id, 'opacity-70': task.status === 'done' }"
                                                 @click="openDetail('task', task.id)">
                                                
                                                <button class="ux-card-open zen-card-open-icon" @click.stop="openDetail('task', task.id)" :aria-label="window.ZenI18n.t('Otwórz zadanie: ') + task.title">
                                                    <span class="zen-icon-wrap" x-html="zenIcon('arrow')" aria-hidden="true"></span>
                                                </button>

                                                <div class="title font-bold text-sm text-gray-900 dark:text-gray-100"
                                                     :class="{ 'line-through text-gray-400': task.status === 'done' }"
                                                     x-text="task.title"></div>
                                                <div class="text-xs text-gray-500 mt-1 line-clamp-2" x-show="task.description" x-text="task.description"></div>
                                                <div class="zen-list-progress" x-show="(task.assignees || []).length || task.status === 'done'">
                                                    <div class="wm-progress zen-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="taskProgress(task)"><div class="wm-progress-fill" :style="'width:' + taskProgress(task) + '%'"></div></div>
                                                    <span x-text="taskProgress(task) + '%'"></span>
                                                </div>

                                                <!-- Kontekst klienta / projektu / leada / usługi -->
                                                <div class="mt-2 text-xs text-brand-600 dark:text-brand-400 font-medium truncate" x-show="task.client_id || task.lead_id || task.service_id || task.project_id">
                                                    <span x-show="task.client_id" x-text="clientName(task.client_id)"></span>
                                                    <span x-show="!task.client_id && task.lead_id" x-text="leads.find(l => l.id === task.lead_id)?.title || ('Lead #' + task.lead_id)"></span>
                                                    <span x-show="!task.client_id && !task.lead_id && task.service_id" x-text="services.find(s => s.id === task.service_id)?.name || ('Usługa #' + task.service_id)"></span>
                                                    <span x-show="!task.client_id && !task.lead_id && !task.service_id && task.project_id" x-text="'Projekt #' + task.project_id"></span>
                                                </div>

                                                <div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-100 dark:border-gray-700/60">
                                                    <div class="flex items-center gap-1.5 flex-wrap">
                                                        <span class="px-2 py-0.5 rounded text-[10px] font-semibold"
                                                              :class="{
                                                                'bg-red-100 text-red-700': task.priority === 'high',
                                                                'bg-yellow-100 text-yellow-700': task.priority === 'medium',
                                                                'bg-green-100 text-green-700': task.priority === 'low'
                                                              }"
                                                              x-text="priorityLabel(task.priority)"></span>
                                                        <span x-show="task.due_date"
                                                              class="text-[10px]"
                                                              :class="isOverdue(task) ? 'text-red-500 font-bold' : 'text-gray-400'"
                                                              x-text="formatDate(task.due_date)"></span>
                                                    </div>

                                                    <!-- Wykonawcy -->
                                                    <div class="flex -space-x-1">
                                                        <template x-for="ta in (task.assignees || []).slice(0, 3)" :key="'kta-' + ta.id">
                                                            <div :title="fullName(ta.user)">
                                                                <template x-if="ta.user?.avatar_url">
                                                                    <img :src="ta.user.avatar_url" class="w-5 h-5 rounded-full object-cover border border-white dark:border-gray-800">
                                                                </template>
                                                                <template x-if="!ta.user?.avatar_url">
                                                                    <div class="w-5 h-5 rounded-full avatar-gradient text-white flex items-center justify-center text-[8px] font-bold border border-white dark:border-gray-800"
                                                                         x-text="initialsFrom(ta.user)"></div>
                                                                </template>
                                                            </div>
