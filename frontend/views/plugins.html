<section x-show="currentView === 'plugins' && !detailView.open" x-cloak x-data="pluginHub()" class="plugin-hub">
    <header class="plugin-heading">
        <div><p class="plugin-eyebrow" x-text="window.ZenI18n.t('Rozszerz swój CRM')"></p><h1 x-text="window.ZenI18n.t('Aplikacje')"></h1><p class="plugin-muted" x-text="window.ZenI18n.t('Gotowe narzędzia do codziennej pracy, w jednym miejscu.')"></p></div>
        <button type="button" class="plugin-button" :disabled="hubBusy" @click="loadHub(); $dispatch('plugins-changed')" x-text="window.ZenI18n.t('Odśwież')"></button>
    </header>
    <p role="status" x-show="!hubLoaded && !hubError" class="plugin-empty" x-text="window.ZenI18n.t('Ładowanie aplikacji…')"></p>
    <div x-show="hubLoaded && !enabled" class="plugin-empty"><h2 x-text="window.ZenI18n.t('Aplikacje są wyłączone w ustawieniach systemu.')"></h2><button type="button" x-show="user?.role === 'admin'" @click="selectView('settings'); settingsTab = 'plugins'" class="plugin-button plugin-primary" x-text="window.ZenI18n.t('Włącz aplikacje w ustawieniach')"></button></div>
    <p role="alert" x-show="hubError" x-text="hubError" class="plugin-alert"></p>
    <div x-show="enabled" class="plugin-content">
        <nav class="plugin-tabs" :aria-label="window.ZenI18n.t('Sekcje aplikacji')">
            <button type="button" :class="{'is-active': hubTab === 'store'}" :aria-current="hubTab === 'store' ? 'page' : null" @click="tab('store')"><span x-text="window.ZenI18n.t('Sklep aplikacji')"></span><span class="plugin-count" x-text="storeApps.length"></span></button>
            <button type="button" :class="{'is-active': hubTab === 'mine'}" :aria-current="hubTab === 'mine' ? 'page' : null" @click="tab('mine')"><span x-text="window.ZenI18n.t('Moje aplikacje')"></span><span class="plugin-count" x-text="ownedApps().length"></span></button>
            <button type="button" x-show="catalog && user?.role === 'admin'" :class="{'is-active': hubTab === 'manage'}" :aria-current="hubTab === 'manage' ? 'page' : null" @click="tab('manage')" x-text="window.ZenI18n.t('Zarządzanie aplikacjami')"></button>
        </nav>
        <div x-show="hubTab === 'store'" class="plugin-section">
            <div class="plugin-banner">
                <div class="plugin-banner-mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><rect x="5" y="5" width="12" height="12" rx="4" fill="currentColor"/><rect x="23" y="5" width="12" height="12" rx="4" fill="currentColor" opacity=".45"/><rect x="5" y="23" width="12" height="12" rx="4" fill="currentColor" opacity=".45"/><path d="M29 23v12m-6-6h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
                <div><h2 x-text="window.ZenI18n.t('Małe narzędzia. Więcej możliwości.')"></h2><p x-text="window.ZenI18n.t('Aplikacje ZenCRM są już preinstalowane. Wybierz narzędzie, sprawdź uprawnienia i dodaj je do swoich aplikacji.')"></p><div class="plugin-banner-tags"><span class="plugin-tag" x-text="window.ZenI18n.t('Bez dodatkowych opłat')"></span><span class="plugin-tag" x-text="window.ZenI18n.t('Zgoda pod Twoją kontrolą')"></span></div></div><div class="plugin-banner-stat"><strong x-text="storeApps.filter(app => app.available).length"></strong><span x-text="window.ZenI18n.t('Dostępne narzędzia')"></span></div>
            </div>
            <div class="plugin-toolbar">
                <label class="plugin-search"><span class="sr-only" x-text="window.ZenI18n.t('Szukaj aplikacji')"></span><input type="search" x-model="storeQuery" :placeholder="window.ZenI18n.t('Szukaj aplikacji')" maxlength="120"></label>
                <label class="plugin-category"><span class="sr-only" x-text="window.ZenI18n.t('Kategoria aplikacji')"></span><select x-model="storeCategory"><option value="" x-text="window.ZenI18n.t('Wszystkie kategorie')"></option><template x-for="category in categories()" :key="category"><option :value="category" x-text="window.ZenI18n.t(category)"></option></template></select></label>
            </div>
            <div class="plugin-section-heading plugin-store-label"><div><h2 x-text="window.ZenI18n.t('Odkryj aplikacje')"></h2><p class="plugin-muted" x-text="window.ZenI18n.t('Wybierz narzędzia dopasowane do swojej pracy.')"></p></div><span class="plugin-tag" x-text="filteredStore().length + ' / ' + storeApps.length"></span></div>
            <div class="plugin-grid"><template x-for="app in filteredStore()" :key="app.id">
                <article class="plugin-card">
                    <div class="plugin-card-top"><span class="plugin-app-icon" :data-category="app.category" aria-hidden="true" x-html="window.ZenPluginVisual.icon(app.category)"></span><span class="plugin-tag" x-text="app.bundled ? window.ZenI18n.t('Preinstalowana') : window.ZenI18n.t('Integracja')"></span></div>
                    <p class="plugin-category-label" x-text="window.ZenI18n.t(app.category)"></p><h2 x-text="appName(app)"></h2><p class="plugin-muted plugin-card-description" x-text="appDescription(app)"></p>
                    <p class="plugin-publisher" x-text="app.bundled ? 'ZenCRM · ' + window.ZenI18n.t('Tylko odczyt') : window.ZenI18n.t('Aplikacja zatwierdzona przez administratora')"></p>
                    <div class="plugin-card-footer"><span class="plugin-status" :class="{'is-enabled': app.available && app.consented_scopes.length}" x-text="!app.available ? window.ZenI18n.t('Wymaga udostępnienia') : app.consented_scopes.length ? window.ZenI18n.t('Dodana do Twoich aplikacji') : window.ZenI18n.t('Dostępna')"></span><button type="button" class="plugin-button" @click="showDetails(app)" x-text="window.ZenI18n.t('Szczegóły')"></button></div>
                </article>
            </template></div>
            <p class="plugin-empty" x-show="hubLoaded && !filteredStore().length" x-text="window.ZenI18n.t('Brak aplikacji pasujących do wyszukiwania.')"></p>
        </div>
        <div x-show="hubTab === 'mine'" class="plugin-section">
            <div class="plugin-section-heading"><div><h2 x-text="window.ZenI18n.t('Moje aplikacje')"></h2><p class="plugin-muted" x-text="window.ZenI18n.t('Narzędzia, którym udzielono zgody na dostęp do danych.')"></p></div><button type="button" class="plugin-button" @click="tab('store')" x-text="window.ZenI18n.t('Przeglądaj sklep')"></button></div>
            <div x-show="!ownedApps().length" class="plugin-empty"><h3 x-text="window.ZenI18n.t('Wybierz swoją pierwszą aplikację')"></h3><p class="plugin-muted" x-text="window.ZenI18n.t('Przejdź do sklepu i dodaj narzędzia, z których chcesz korzystać.')"></p></div>
            <div class="plugin-owned"><template x-for="app in ownedApps()" :key="app.id"><article class="plugin-owned-card" :class="{'is-selected': workspaceApp === app.id}"><span class="plugin-app-icon" :data-category="app.category" aria-hidden="true" x-html="window.ZenPluginVisual.icon(app.category)"></span><div><h3 x-text="appName(app)"></h3><p class="plugin-muted" x-text="window.ZenI18n.t(app.category)"></p></div><div class="plugin-actions"><button type="button" class="plugin-button plugin-primary" @click="openApp(app)" x-text="window.ZenI18n.t('Otwórz aplikację')"></button><button type="button" class="plugin-button" @click="showDetails(app)" x-text="window.ZenI18n.t('Uprawnienia')"></button></div></article></template></div>
            <div x-show="workspaceApp" x-data="pluginSlot('app.page')"><% include "views/plugin-slot.html" %></div>
        </div>
        <dialog x-ref="pluginDetails" class="plugin-modal" aria-labelledby="plugin-details-title" @cancel.prevent="closeDetails()" @click="dialogBackdrop($event)" @keydown.tab="trapDetailsFocus($event)">
            <template x-if="storeDetail"><section class="plugin-consent">
                <header class="plugin-modal-heading">
                    <span class="plugin-app-icon" :data-category="storeDetail.category" aria-hidden="true" x-html="window.ZenPluginVisual.icon(storeDetail.category)"></span>
                    <div><p class="plugin-eyebrow" x-text="window.ZenI18n.t(storeDetail.category)"></p><h2 id="plugin-details-title" x-text="appName(storeDetail)"></h2><p class="plugin-muted" x-text="(storeDetail.bundled ? 'ZenCRM · ' : '') + window.ZenI18n.t('Wersja') + ' ' + storeDetail.manifest.version"></p></div>
                    <button type="button" autofocus class="plugin-modal-close" @click="closeDetails()" :aria-label="window.ZenI18n.t('Zamknij')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke-width="1.8" stroke-linecap="round"/></svg></button>
                </header>
                <div class="plugin-modal-body">
                    <div class="plugin-modal-description"><h3 x-text="window.ZenI18n.t('O aplikacji')"></h3><p x-text="appDescription(storeDetail)"></p>
                        <div x-show="menuViews(storeDetail).length" class="plugin-modal-views"><h3 x-text="window.ZenI18n.t('Widoki w menu')"></h3><ul><template x-for="view in menuViews(storeDetail)" :key="view.id"><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 5h16v14H4zM4 10h16M9 10v9" stroke-width="1.5" stroke-linejoin="round"/></svg><span x-text="storeDetail.bundled ? window.ZenI18n.t(view.label) : view.label"></span></li></template></ul><p class="plugin-muted" x-text="window.ZenI18n.t('Po udzieleniu zgody znajdziesz te widoki w bocznym menu.')"></p></div>
                    </div>
                    <div class="plugin-modal-access"><h3 x-text="window.ZenI18n.t('Zakres dostępu')"></h3><ul class="plugin-permissions"><template x-for="scope in storeDetail.approved_scopes.length ? storeDetail.approved_scopes : storeDetail.manifest.scopes" :key="scope"><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m5 12 4 4 10-10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span x-text="storeDetail.scope_descriptions[scope] || scope"></span></li></template></ul><p class="plugin-muted" x-text="window.ZenI18n.t('Każda aplikacja wymaga Twojej zgody. Zakres dostępu jest ograniczony uprawnieniami i przypisaniem rekordów.')"></p><span class="plugin-tag" x-show="storeDetail.bundled" x-text="window.ZenI18n.t('Tylko odczyt')"></span></div>
                </div>
                <div class="plugin-modal-extra">
                    <p x-show="storeDetail.available === false" class="plugin-notice" x-text="window.ZenI18n.t('Administrator musi włączyć aplikację i udostępnić ją Twojemu kontu.')"></p>
                    <p role="alert" x-show="hubError" x-text="hubError" class="plugin-alert"></p>
                    <details x-show="storeDetail.manifest.type === 'remote' && storeDetail.consented_scopes.length"><summary x-text="window.ZenI18n.t('Zaawansowany dostęp API')"></summary><div class="plugin-actions"><button type="button" class="plugin-button" :disabled="hubBusy" @click="showSecret(storeDetail)" x-text="window.ZenI18n.t('Token osobisty na 24 godziny')"></button><button type="button" class="plugin-button" :disabled="hubBusy" @click="revokeAppTokens(storeDetail)" x-text="window.ZenI18n.t('Unieważnij tokeny')"></button></div></details>
                    <div x-show="oneTimeSecret" class="plugin-secret"><p x-text="window.ZenI18n.t('Zapisz sekret teraz. Nie będzie dostępny ponownie. Przechowuj go poza konfiguracją aplikacji.')"></p><textarea readonly :value="oneTimeSecret" rows="6" :aria-label="window.ZenI18n.t('Sekret aplikacji')"></textarea><button type="button" class="plugin-button" @click="oneTimeSecret = ''" x-text="window.ZenI18n.t('Ukryj sekret')"></button></div>
                </div>
                <footer class="plugin-modal-footer"><span class="plugin-status" :class="{'is-enabled': storeDetail.consented_scopes.length && storeDetail.available !== false}" x-text="storeDetail.consented_scopes.length ? window.ZenI18n.t('Zgoda udzielona') : window.ZenI18n.t('Wymagana Twoja zgoda')"></span><div class="plugin-actions">
                    <button type="button" class="plugin-button plugin-primary" :disabled="hubBusy || storeDetail.available === false" x-show="!storeDetail.consented_scopes.length" @click="consentApp(storeDetail)" x-text="window.ZenI18n.t('Dodaj do moich aplikacji')"></button>
                    <button type="button" class="plugin-button plugin-primary" :disabled="hubBusy" x-show="storeDetail.consented_scopes.length && storeDetail.available !== false" @click="openApp(storeDetail)" x-text="window.ZenI18n.t('Otwórz aplikację')"></button>
                    <button type="button" class="plugin-button plugin-danger" :disabled="hubBusy" x-show="storeDetail.consented_scopes.length" @click="consentApp(storeDetail, true)" x-text="window.ZenI18n.t('Cofnij zgodę')"></button>
                    <button type="button" class="plugin-button plugin-primary" :disabled="hubBusy" x-show="authorization?.app_id === storeDetail.id && storeDetail.consented_scopes.length && storeDetail.available !== false" @click="completeAuthorization(storeDetail)" x-text="window.ZenI18n.t('Połącz konto z aplikacją')"></button>
                </div></footer>
            </section></template>
        </dialog>
        <div x-show="oneTimeSecret && !storeDetail" class="plugin-detail plugin-secret"><p x-text="window.ZenI18n.t('Zapisz sekret teraz. Nie będzie dostępny ponownie. Przechowuj go poza konfiguracją aplikacji.')"></p><textarea readonly :value="oneTimeSecret" rows="8" :aria-label="window.ZenI18n.t('Sekret aplikacji')"></textarea><button type="button" @click="oneTimeSecret = ''" class="plugin-button" x-text="window.ZenI18n.t('Zamknij')"></button></div>
        <section x-show="hubTab === 'manage' && catalog && user?.role === 'admin'" class="plugin-section">
            <div class="plugin-section-heading"><div><h2 x-text="window.ZenI18n.t('Zarządzanie aplikacjami')"></h2><p class="plugin-muted" x-text="window.ZenI18n.t('Kontroluj dostępność aplikacji, uprawnienia i dostęp użytkowników.')"></p></div><button type="button" class="plugin-button" :disabled="hubBusy" @click="newApp()" x-text="window.ZenI18n.t('Nowa aplikacja')"></button></div>
            <div class="plugin-admin-layout"><div class="plugin-admin-grid"><template x-for="app in catalog?.apps || []" :key="app.id"><button type="button" class="plugin-admin-item" :class="{'is-selected': selected?.id === app.id}" :disabled="hubBusy" @click="editApp(app); diagnostic = []; diagnosticKind = ''"><span class="plugin-app-icon" :data-category="app.category" aria-hidden="true" x-html="window.ZenPluginVisual.icon(app.category)"></span><span><strong x-text="appName(app)"></strong><span class="plugin-muted" x-text="app.bundled ? 'ZenCRM' : window.ZenI18n.t('Integracja')"></span></span><span class="plugin-status" :class="{'is-enabled': app.enabled}" x-text="appStatus(app)"></span></button></template></div>
            <div class="plugin-admin-editor"><div x-show="!selected && !newAppOpen" class="plugin-admin-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 4h16v16H4zM4 9h16M9 9v11" stroke-width="1.5" stroke-linejoin="round"/></svg><h3 x-text="window.ZenI18n.t('Wybierz aplikację')"></h3><p class="plugin-muted" x-text="window.ZenI18n.t('Tutaj zarządzisz dostępem, uprawnieniami i konfiguracją.')"></p></div><div x-show="newAppOpen" class="plugin-detail"><h3 x-text="window.ZenI18n.t('Nowa aplikacja')"></h3><label><span x-text="window.ZenI18n.t('Manifest JSON')"></span><textarea x-model="manifestText" rows="10" maxlength="32768" :aria-label="window.ZenI18n.t('Manifest JSON')"></textarea></label><button type="button" class="plugin-button plugin-primary" :disabled="hubBusy || !manifestText" @click="registerApp()" x-text="window.ZenI18n.t('Zarejestruj aplikację')"></button></div>
            <template x-if="selected"><div class="plugin-detail">
                <div class="plugin-section-heading"><div><h2 x-text="appName(selected)"></h2><p class="plugin-muted" x-text="appStatus(selected)"></p></div><div class="plugin-actions"><button type="button" class="plugin-button plugin-primary" :disabled="hubBusy || !selected.installed" x-show="!selected.enabled" @click="stateApp('enable')" x-text="window.ZenI18n.t('Włącz')"></button><button type="button" class="plugin-button" :disabled="hubBusy" x-show="selected.enabled" @click="stateApp('disable')" x-text="window.ZenI18n.t('Wyłącz')"></button><button type="button" class="plugin-button plugin-danger" :disabled="hubBusy || !selected.installed" @click="stateApp('uninstall')" x-text="window.ZenI18n.t('Odinstaluj')"></button></div></div>
                <p class="plugin-notice" x-text="window.ZenI18n.t('Zmiana manifestu i instalacji wymaga wyłączenia aplikacji oraz ponownej zgody użytkowników.')"></p>
                <div class="plugin-install-grid">
                    <fieldset :disabled="hubBusy || selected.enabled"><legend x-text="window.ZenI18n.t('Zatwierdzone uprawnienia')"></legend><template x-for="scope in selected.manifest.scopes" :key="scope"><label class="plugin-checkbox"><input type="checkbox" :value="scope" x-model="selectedScopes"><span x-text="catalog?.scopes[scope] || scope"></span></label></template></fieldset>
                    <fieldset :disabled="hubBusy || selected.enabled"><legend x-text="window.ZenI18n.t('Użytkownicy aplikacji')"></legend><label x-show="selected.bundled" class="plugin-checkbox"><input type="checkbox" x-model="allUsers"><span x-text="window.ZenI18n.t('Wszyscy aktywni użytkownicy, także nowe konta')"></span></label><div x-show="!allUsers" class="plugin-user-list"><template x-for="person in catalog?.users || []" :key="person.id"><label class="plugin-checkbox"><input type="checkbox" :value="person.id" x-model.number="selectedUsers"><span><strong x-text="person.name || person.email"></strong><small x-text="person.email"></small></span></label></template></div></fieldset>
                </div>
                <button type="button" class="plugin-button plugin-primary" :disabled="hubBusy || selected.enabled || !selectedScopes.length || (!allUsers && !selectedUsers.length)" @click="installApp()" x-text="window.ZenI18n.t('Zatwierdź instalację')"></button>
                <details class="plugin-advanced"><summary x-text="window.ZenI18n.t('Konfiguracja zaawansowana')"></summary><label><span x-text="window.ZenI18n.t('Konfiguracja JSON bez sekretów')"></span><textarea x-model="configurationText" :disabled="selected.enabled || hubBusy" rows="3"></textarea></label><label><span x-text="window.ZenI18n.t('Manifest JSON')"></span><textarea x-model="manifestText" :readonly="selected.bundled" :disabled="selected.enabled || hubBusy" rows="10" maxlength="32768"></textarea></label><button type="button" x-show="!selected.bundled" class="plugin-button" :disabled="hubBusy || selected.enabled || !manifestText" @click="registerApp(true)" x-text="window.ZenI18n.t('Zaktualizuj manifest')"></button><button type="button" class="plugin-button" :disabled="hubBusy" x-show="selected.manifest.type === 'remote'" @click="showSecret(selected, true)" x-text="window.ZenI18n.t('Utwórz lub zmień sekrety')"></button></details>
                <div class="plugin-actions"><button type="button" class="plugin-button" :disabled="hubBusy" @click="inspectApp('audit')" x-text="window.ZenI18n.t('Historia dostępu')"></button><button type="button" class="plugin-button" :disabled="hubBusy" @click="inspectApp('deliveries')" x-text="window.ZenI18n.t('Dostarczenia zdarzeń')"></button></div>
                <div x-show="diagnosticKind" class="plugin-diagnostics"><h3 x-text="diagnosticKind === 'audit' ? window.ZenI18n.t('Historia dostępu') : window.ZenI18n.t('Dostarczenia zdarzeń')"></h3><p x-show="!diagnostic.length" class="plugin-muted" x-text="window.ZenI18n.t('Brak wpisów')"></p><ul><template x-for="row in diagnostic" :key="row.id"><li><strong x-text="diagnosticLabel(row.action || row.status)"></strong><span x-text="diagnosticKind === 'audit' ? diagnosticUser(row.user_id) : row.event_id"></span><time x-text="new Date((row.created_at || row.next_attempt_at) + 'Z').toLocaleString()"></time></li></template></ul></div>
            </div></template></div></div>
        </section>
    </div>
</section>
