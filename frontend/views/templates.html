<!-- ═══ SZABLONY ═══ -->
            <div :inert="detailView.open &amp;&amp; detailPanel" x-show="(!detailView.open || detailPanel) &amp;&amp; currentView === &#x27;templates&#x27;" x-cloak>
                <div class="flex justify-end mb-4"><button type="button" x-show="canRecordAction('templates', 'create')" @click="openTemplateModal()" class="ux-button" x-text="window.ZenI18n.t('+ Dodaj szablon')">+ Dodaj szablon</button></div>
                <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                    <template x-for="t in pagedItems('templates', templates)" :key="t.id">
                        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 p-5">
                            <h3 class="font-semibold" x-text="t.name"></h3>
                            <span class="px-2 py-0.5 text-xs rounded-full" x-text="t.type === &#x27;offer&#x27; ? window.ZenI18n.t(&#x27;Oferta&#x27;) : window.ZenI18n.t(&#x27;Dokument&#x27;)"></span>
                            <div class="flex gap-2 mt-3">
                                <button @click="openTemplateModal(t)" class="zen-list-action zen-action-edit" :aria-label="window.ZenI18n.t(&quot;Edytuj&quot;)" :title="window.ZenI18n.t(&quot;Edytuj&quot;)"><span x-html="zenIcon(&#x27;edit&#x27;)" aria-hidden="true"></span></button>
                                <button @click="remove(t.id)" class="zen-list-action zen-action-trash" :aria-label="window.ZenI18n.t(&quot;Usuń&quot;)" :title="window.ZenI18n.t(&quot;Usuń&quot;)"><span x-html="zenIcon(&#x27;trash&#x27;)" aria-hidden="true"></span></button>
                            </div>
                        </div>
                    </template>
                </div>
                <div x-data="{ pagerView: 'templates', get pagerItems() { return this.templates } }"><% include "views/pagination.html" %></div>
            </div>
