<template x-if="!detailView.open && (user?.role === 'admin' || isAdmin) && ['portalSettings', 'portalUsers', 'portalTickets', 'portalSpaces'].includes(currentView)">
    <div class="portal-admin-view">
        <div class="flex flex-col h-[calc(100vh-80px)] rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-hidden shadow-xs">
            <div class="px-5 py-3 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between flex-wrap gap-3 bg-gray-50/70 dark:bg-gray-900/50">
                <div class="flex items-center gap-2 flex-wrap">
                    <button type="button" @click="selectView('portalTickets')"
                            class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition"
                            :class="currentView === 'portalTickets' ? 'bg-brand-600 text-white shadow-xs' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'">
                        <span x-text="window.ZenI18n.t('Tickety')">Tickety</span>
                    </button>
                    <button type="button" @click="selectView('portalSpaces')"
                            class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition"
                            :class="currentView === 'portalSpaces' ? 'bg-brand-600 text-white shadow-xs' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'">
                        <span x-text="window.ZenI18n.t('Portale klientów')">Portale klientów</span>
                    </button>
                    <button type="button" @click="selectView('portalUsers')"
                            class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition"
                            :class="currentView === 'portalUsers' ? 'bg-brand-600 text-white shadow-xs' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'">
                        <span x-text="window.ZenI18n.t('Użytkownicy portalu')">Użytkownicy portalu</span>
                    </button>
                    <button type="button" @click="selectView('portalSettings')"
                            class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition"
                            :class="currentView === 'portalSettings' ? 'bg-brand-600 text-white shadow-xs' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'">
                        <span x-text="window.ZenI18n.t('Ustawienia portalu')">Ustawienia portalu</span>
                    </button>
                </div>
                <a href="/portal.html" target="_blank" rel="noopener"
                   class="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline inline-flex items-center gap-1.5">
                    <span x-text="window.ZenI18n.t('Otwórz strefę klienta ↗')">Otwórz strefę klienta ↗</span>
                </a>
            </div>
            <div class="flex-1 min-h-0 bg-gray-50 dark:bg-gray-900">
                <iframe :key="currentView + '-' + (darkMode ? 'dark' : 'light')"
                        :src="'/workspace.html?embed=1' + (darkMode ? '&dark=1' : '') + '#' + ({portalSettings:'portal-settings', portalUsers:'portal-users', portalTickets:'portal-tickets', portalSpaces:'portal-spaces'}[currentView] || 'portal-users')"
                        :title="({portalSettings:window.ZenI18n.t(&#x27;Ustawienia portalu&#x27;), portalUsers:window.ZenI18n.t(&#x27;Użytkownicy portalu&#x27;), portalTickets:window.ZenI18n.t(&#x27;Tickety portalu&#x27;), portalSpaces:window.ZenI18n.t(&#x27;Portale klientów&#x27;)}[currentView] || window.ZenI18n.t(&#x27;Portal użytkownika&#x27;))"
                        class="w-full h-full border-0">
                </iframe>
            </div>
        </div>
    </div>
</template>
