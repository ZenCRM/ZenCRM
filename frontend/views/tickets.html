<!-- ═══════════════ TICKETY / HELPDESK ═══════════════ -->
<div x-show="!detailView.open && currentView === 'tickets'" x-cloak class="p-4 sm:p-6 space-y-6">

    <!-- NAGŁÓWEK -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100 flex items-center gap-2.5">
                <svg class="w-7 h-7 text-brand-600 dark:text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>
                </svg>
                <span x-text="window.ZenI18n.t('Tickety')"></span>
            </h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" x-text="window.ZenI18n.t('Zarządzanie zgłoszeniami klientów, wsparciem technicznym i helpdeskiem')"></p>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <a :href="ticketConfig?.helpdesk_path || '/pomoc'" target="_blank"
               class="inline-flex items-center gap-2 px-3.5 py-2 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 shadow-sm transition">
                <svg class="w-4 h-4 text-brand-600 dark:text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
                <span x-text="window.ZenI18n.t('Portal pomocy (dla klienta)')"></span>
            </a>
            <button type="button" @click="openNewTicketModal()"
                    class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-lg bg-brand-600 hover:bg-brand-700 text-white shadow-sm transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span x-text="window.ZenI18n.t('Nowy ticket')"></span>
            </button>
        </div>
    </div>

    <!-- STATYSTYKI KAFELKI -->
    <div class="zen-task-summary zen-ticket-metrics">
        <button type="button" class="zen-task-summary-tile" @click="ticketFilter = ''" :aria-pressed="ticketFilter === ''">
            <span class="zen-icon-wrap" x-html="zenIcon('flag')" aria-hidden="true"></span>
            <span x-text="window.ZenI18n.t('Wszystkie')">Wszystkie</span>
            <strong x-text="ticketStats.all"></strong>
        </button>
        <button type="button" class="zen-task-summary-tile" @click="ticketFilter = 'new'" :aria-pressed="ticketFilter === 'new'">
            <span class="zen-icon-wrap" x-html="zenIcon('activity')" aria-hidden="true"></span>
            <span x-text="window.ZenI18n.t('Nowe')">Nowe</span>
            <strong x-text="ticketStats.new"></strong>
        </button>
        <button type="button" class="zen-task-summary-tile" @click="ticketFilter = 'open'" :aria-pressed="ticketFilter === 'open'">
            <span class="zen-icon-wrap" x-html="zenIcon('calendar')" aria-hidden="true"></span>
            <span x-text="window.ZenI18n.t('W toku / Oczekujące')">W toku / Oczekujące</span>
            <strong x-text="ticketStats.open"></strong>
        </button>
        <button type="button" class="zen-task-summary-tile" @click="ticketFilter = 'resolved'" :aria-pressed="ticketFilter === 'resolved'">
            <span class="zen-icon-wrap" x-html="zenIcon('check')" aria-hidden="true"></span>
            <span x-text="window.ZenI18n.t('Rozwiązane')">Rozwiązane</span>
            <strong x-text="ticketStats.resolved"></strong>
        </button>
    </div>

    <!-- PASEK FILTRÓW I SZUKANIA -->
    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-xs space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">
            <!-- Wyszukiwarka -->
            <div class="lg:col-span-2 relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input type="text" x-model="ticketSearch"
                       :placeholder="window.ZenI18n.t('Szukaj po numerze, tytule, emailu...')"
                       class="w-full pl-9 pr-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <!-- Status -->
            <div>
                <select x-model="ticketFilter" class="w-full py-2 px-3 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="" x-text="window.ZenI18n.t('Wszystkie statusy')"></option>
                    <option value="new" x-text="window.ZenI18n.t('Nowy')"></option>
                    <option value="open" x-text="window.ZenI18n.t('W toku')"></option>
                    <option value="pending_client" x-text="window.ZenI18n.t('Oczekuje na klienta')"></option>
                    <option value="resolved" x-text="window.ZenI18n.t('Rozwiązany')"></option>
                    <option value="closed" x-text="window.ZenI18n.t('Zamknięty')"></option>
                </select>
            </div>

            <!-- Kategoria -->
            <div>
                <select x-model="ticketCategoryFilter" class="w-full py-2 px-3 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="" x-text="window.ZenI18n.t('Wszystkie kategorie')"></option>
                    <template x-for="cat in ticketCategories" :key="cat.id">
                        <option :value="cat.id" x-text="cat.name"></option>
                    </template>
                </select>
            </div>

            <!-- Priorytet -->
            <div>
                <select x-model="ticketPriorityFilter" class="w-full py-2 px-3 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="" x-text="window.ZenI18n.t('Wszystkie priorytety')"></option>
                    <option value="low" x-text="window.ZenI18n.t('Niski')"></option>
                    <option value="medium" x-text="window.ZenI18n.t('Średni')"></option>
                    <option value="high" x-text="window.ZenI18n.t('Wysoki')"></option>
                    <option value="urgent" x-text="window.ZenI18n.t('Pilny')"></option>
                </select>
            </div>

            <!-- Opiekun / Zespół -->
            <div>
                <select x-model="ticketAssigneeFilter" class="w-full py-2 px-3 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="" x-text="window.ZenI18n.t('Wszyscy opiekunowie')"></option>
                    <template x-for="u in users" :key="u.id">
                        <option :value="u.id" x-text="fullName(u)"></option>
                    </template>
                </select>
            </div>
        </div>

        <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 pt-1" x-show="ticketSearch || ticketFilter || ticketCategoryFilter || ticketPriorityFilter || ticketAssigneeFilter || ticketTeamFilter">
            <span x-text="window.ZenI18n.t('Znaleziono: ') + filteredTickets.length + ' ' + window.ZenI18n.t('zgłoszeń')"></span>
            <button type="button" @click="ticketSearch = ''; ticketFilter = ''; ticketCategoryFilter = ''; ticketPriorityFilter = ''; ticketAssigneeFilter = ''; ticketTeamFilter = '';"
                    class="text-brand-600 dark:text-brand-400 hover:underline">
                <span x-text="window.ZenI18n.t('Wyczyść filtry')"></span>
            </button>
        </div>
    </div>

    <!-- TABELA TICKETÓW -->
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-xs overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-gray-600 dark:text-gray-300">
                <thead class="bg-gray-50 dark:bg-gray-900/50 text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 border-b border-gray-200 dark:border-gray-700">
                    <tr>
                        <th class="py-3.5 px-4" x-text="window.ZenI18n.t('Numer')"></th>
                        <th class="py-3.5 px-4" x-text="window.ZenI18n.t('Temat')"></th>
                        <th class="py-3.5 px-4" x-text="window.ZenI18n.t('Klient / Zgłaszający')"></th>
                        <th class="py-3.5 px-4" x-text="window.ZenI18n.t('Kategoria')"></th>
                        <th class="py-3.5 px-4" x-text="window.ZenI18n.t('Priorytet')"></th>
                        <th class="py-3.5 px-4" x-text="window.ZenI18n.t('Status')"></th>
                        <th class="py-3.5 px-4" x-text="window.ZenI18n.t('Opiekun / Zespół')"></th>
                        <th class="py-3.5 px-4" x-text="window.ZenI18n.t('Data')"></th>
                        <th class="py-3.5 px-4 text-right" x-text="window.ZenI18n.t('Akcje')"></th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                    <template x-for="tck in pagedItems('tickets', filteredTickets)" :key="tck.id">
                        <tr class="hover:bg-gray-50/70 dark:hover:bg-gray-700/40 transition cursor-pointer"
                            @click="openTicketDetails(tck)">
                            <!-- Numer -->
                            <td class="py-3 px-4 font-mono text-xs font-bold text-brand-600 dark:text-brand-400 whitespace-nowrap"
                                x-text="tck.ticket_number"></td>

                            <!-- Temat -->
                            <td class="py-3 px-4 font-medium text-gray-900 dark:text-gray-100 max-w-xs truncate">
                                <span x-text="tck.title"></span>
                            </td>

                            <!-- Klient / Zgłaszający -->
                            <td class="py-3 px-4 max-w-xs">
                                <div class="truncate">
                                    <span class="font-medium text-gray-900 dark:text-gray-100" x-text="tck.client_name || tck.contact_name || tck.contact_email"></span>
                                    <template x-if="tck.client_id">
                                        <span class="ml-1 inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300">
                                            Klient CRM
                                        </span>
                                    </template>
                                </div>
                                <div class="text-xs text-gray-500 dark:text-gray-400 truncate" x-text="tck.contact_email"></div>
                            </td>

                            <!-- Kategoria -->
                            <td class="py-3 px-4 whitespace-nowrap">
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300"
                                      x-text="ticketCategoryLabel(tck.category)"></span>
                            </td>

                            <!-- Priorytet -->
                            <td class="py-3 px-4 whitespace-nowrap">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
                                      :class="ticketPriorityClass(tck.priority)"
                                      x-text="ticketPriorityLabel(tck.priority)"></span>
                            </td>

                            <!-- Status -->
                            <td class="py-3 px-4 whitespace-nowrap">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
                                      :class="ticketStatusClass(tck.status)"
                                      x-text="ticketStatusLabel(tck.status)"></span>
                            </td>

                            <!-- Opiekun / Zespół -->
                            <td class="py-3 px-4 whitespace-nowrap text-xs">
                                <div x-show="tck.assignee_name" class="font-medium text-gray-900 dark:text-gray-100 flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                    <span x-text="tck.assignee_name"></span>
                                </div>
                                <div x-show="tck.team_name" class="text-gray-500 dark:text-gray-400 flex items-center gap-1.5 mt-0.5">
                                    <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                                    <span x-text="tck.team_name"></span>
                                </div>
                                <div x-show="!tck.assignee_name && !tck.team_name" class="text-gray-400 italic" x-text="window.ZenI18n.t('Nieprzypisany')"></div>
                            </td>

                            <!-- Data -->
                            <td class="py-3 px-4 text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap"
                                x-text="new Date(tck.created_at).toLocaleDateString(locale, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })"></td>

                            <!-- Akcje -->
                            <td class="py-3 px-4 text-right whitespace-nowrap" @click.stop>
                                <div class="inline-flex items-center gap-1">
                                    <button type="button" @click="copyTrackingLink(tck.token)"
                                            :title="window.ZenI18n.t('Kopiuj link do śledzenia')"
                                            class="p-1.5 rounded text-gray-400 hover:text-brand-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                    </button>
                                    <button type="button" @click="openTicketDetails(tck)"
                                            :title="window.ZenI18n.t('Otwórz szczegóły')"
                                            class="p-1.5 rounded text-gray-400 hover:text-brand-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                    </button>
                                    <button type="button" @click="deleteTicket(tck.id)"
                                            :title="window.ZenI18n.t('Usuń ticket')"
                                            class="p-1.5 rounded text-gray-400 hover:text-red-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        <div x-data="{ pagerView: 'tickets', get pagerItems() { return this.filteredTickets } }"><% include "views/pagination.html" %></div>

        <!-- Stan pusty -->
        <div x-show="filteredTickets.length === 0" class="py-12 text-center text-gray-500 dark:text-gray-400">
            <svg class="w-12 h-12 mx-auto text-gray-300 dark:text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>
            </svg>
            <p class="font-medium text-base text-gray-700 dark:text-gray-300" x-text="window.ZenI18n.t('Brak ticketów do wyświetlenia')"></p>
            <p class="text-xs text-gray-400 mt-1" x-text="window.ZenI18n.t('Dopasuj kryteria filtrów lub utwórz nowe zgłoszenie.')"></p>
            <button type="button" @click="openNewTicketModal()" class="mt-4 inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-brand-600 hover:bg-brand-700 text-white shadow-xs transition">
                <span x-text="window.ZenI18n.t('+ Utwórz ticket')"></span>
            </button>
        </div>
    </div>

    <!-- ═══════════════ SZCZEGÓŁY TICKETU (DRAWER / SLIDE-OVER) ═══════════════ -->
    <div x-show="ticketDrawer.open" x-cloak class="fixed inset-0 z-50 overflow-hidden" aria-labelledby="slide-over-title" role="dialog" aria-modal="true">
        <!-- Tło z blur -->
        <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-xs transition-opacity"
             @click="closeTicketDrawer()"></div>

        <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-4xl bg-white dark:bg-gray-800 shadow-2xl flex flex-col border-l border-gray-200 dark:border-gray-700">

                <!-- NAGŁÓWEK SZCZEGÓŁÓW -->
                <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex items-start justify-between bg-gray-50/70 dark:bg-gray-900/50">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-mono text-xs font-bold px-2 py-0.5 rounded bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300"
                                  x-text="ticketDrawer.ticket?.ticket_number"></span>
                            <span class="text-xs text-gray-500 dark:text-gray-400"
                                  x-text="'Źródło: ' + (ticketDrawer.ticket?.source || 'web')"></span>
                        </div>
                        <h2 class="text-lg font-bold text-gray-900 dark:text-gray-100" x-text="ticketDrawer.ticket?.title"></h2>
                    </div>
                    <button type="button" @click="closeTicketDrawer()"
                            class="p-2 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>

                <!-- PASEK METADANYCH I SZYBKIEJ ZMIANY -->
                <div class="p-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                    <!-- Status -->
                    <div>
                        <label class="block font-medium text-gray-500 dark:text-gray-400 mb-1" x-text="window.ZenI18n.t('Status')"></label>
                        <select :value="ticketDrawer.ticket?.status"
                                @change="changeTicketStatus(ticketDrawer.ticket, $event.target.value)"
                                class="w-full py-1.5 px-2 font-semibold rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
                            <option value="new" x-text="window.ZenI18n.t('Nowy')"></option>
                            <option value="open" x-text="window.ZenI18n.t('W toku')"></option>
                            <option value="pending_client" x-text="window.ZenI18n.t('Oczekuje na klienta')"></option>
                            <option value="resolved" x-text="window.ZenI18n.t('Rozwiązany')"></option>
                            <option value="closed" x-text="window.ZenI18n.t('Zamknięty')"></option>
                        </select>
                    </div>

                    <!-- Priorytet -->
                    <div>
                        <label class="block font-medium text-gray-500 dark:text-gray-400 mb-1" x-text="window.ZenI18n.t('Priorytet')"></label>
                        <select :value="ticketDrawer.ticket?.priority"
                                @change="changeTicketPriority(ticketDrawer.ticket, $event.target.value)"
                                class="w-full py-1.5 px-2 font-semibold rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
                            <option value="low" x-text="window.ZenI18n.t('Niski')"></option>
                            <option value="medium" x-text="window.ZenI18n.t('Średni')"></option>
                            <option value="high" x-text="window.ZenI18n.t('Wysoki')"></option>
                            <option value="urgent" x-text="window.ZenI18n.t('Pilny')"></option>
                        </select>
                    </div>

                    <!-- Opiekun -->
                    <div>
                        <label class="block font-medium text-gray-500 dark:text-gray-400 mb-1" x-text="window.ZenI18n.t('Opiekun')"></label>
                        <select :value="ticketDrawer.ticket?.assignee_id || ''"
                                @change="changeTicketAssignee(ticketDrawer.ticket, $event.target.value)"
                                class="w-full py-1.5 px-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
                            <option value="" x-text="window.ZenI18n.t('Nieprzypisany')"></option>
                            <template x-for="u in users" :key="u.id">
                                <option :value="u.id" x-text="fullName(u)"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Zespół -->
                    <div>
                        <label class="block font-medium text-gray-500 dark:text-gray-400 mb-1" x-text="window.ZenI18n.t('Zespół')"></label>
                        <select :value="ticketDrawer.ticket?.team_id || ''"
                                @change="changeTicketTeam(ticketDrawer.ticket, $event.target.value)"
                                class="w-full py-1.5 px-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
                            <option value="" x-text="window.ZenI18n.t('Brak zespołu')"></option>
                            <template x-for="tm in teams" :key="tm.id">
                                <option :value="tm.id" x-text="tm.name"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- INFO O ZGŁASZAJĄCYM I LINK DO ŚLEDZENIA -->
                <div class="px-5 py-3.5 bg-gray-50/50 dark:bg-gray-900/30 border-b border-gray-200 dark:border-gray-700 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                        <span class="text-gray-500 dark:text-gray-400" x-text="window.ZenI18n.t('Zgłaszający:')"></span>
                        <strong class="text-gray-900 dark:text-gray-100 ml-1" x-text="ticketDrawer.ticket?.contact_name || ticketDrawer.ticket?.contact_email"></strong>
                        <span class="text-gray-400 ml-1" x-show="ticketDrawer.ticket?.contact_email" x-text="'<' + ticketDrawer.ticket?.contact_email + '>'"></span>
                        <template x-if="ticketDrawer.ticket?.client_id">
                            <button type="button" @click="openDetail('client', ticketDrawer.ticket.client_id); closeTicketDrawer()"
                                    class="ml-2 font-semibold text-brand-600 dark:text-brand-400 hover:underline">
                                <span x-text="window.ZenI18n.t('Zobacz klienta →')"></span>
                            </button>
                        </template>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" @click="copyTrackingLink(ticketDrawer.ticket?.token)"
                                class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 font-medium shadow-2xs">
                            <svg class="w-3.5 h-3.5 text-brand-600 dark:text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            <span x-text="window.ZenI18n.t('Kopiuj link klienta')"></span>
                        </button>
                    </div>
                </div>

                <!-- TREŚĆ I HISTORIA WIADOMOŚCI -->
                <div class="flex-1 overflow-y-auto p-5 space-y-4">

                    <!-- GŁÓWNA TREŚĆ TICKETU (tylko jako fallback, gdy brak wiadomości) -->
                    <template x-if="!(ticketDrawer.ticket?.messages || []).length && ticketDrawer.ticket?.description">
                        <div class="p-4 rounded-xl bg-blue-50/40 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900/40">
                            <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 mb-2">
                                <span class="font-semibold text-gray-900 dark:text-gray-100" x-text="ticketDrawer.ticket?.contact_name || ticketDrawer.ticket?.contact_email || 'Klient'"></span>
                                <span x-text="new Date(ticketDrawer.ticket?.created_at).toLocaleString(locale)"></span>
                            </div>
                            <div class="text-sm text-gray-800 dark:text-gray-200 whitespace-pre-wrap" x-text="ticketDrawer.ticket?.description"></div>
                        </div>
                    </template>

                    <!-- PĘTLA WIADOMOŚCI -->
                    <template x-for="msg in (ticketDrawer.ticket?.messages || [])" :key="msg.id">
                        <div class="rounded-xl p-4 transition text-sm"
                             :class="{
                                 'bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/60 ml-4': msg.is_internal,
                                 'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 mr-4': msg.sender_type === 'client',
                                 'bg-brand-50/50 dark:bg-gray-700/60 border border-brand-200 dark:border-gray-600 ml-4': msg.sender_type === 'agent' && !msg.is_internal
                             }">
                            <div class="flex items-center justify-between text-xs mb-2">
                                <div class="flex items-center gap-2">
                                    <strong class="text-gray-900 dark:text-gray-100" x-text="msg.sender_name"></strong>
                                    <template x-if="msg.is_internal">
                                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-bold bg-amber-200 text-amber-900 dark:bg-amber-900 dark:text-amber-200">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                            <span x-text="window.ZenI18n.t('Notatka wewnętrzna')"></span>
                                        </span>
                                    </template>
                                    <template x-if="!msg.is_internal && msg.sender_type === 'agent'">
                                        <span class="inline-flex items-center px-1.5 py-0.2 rounded text-[10px] font-semibold bg-brand-100 text-brand-800 dark:bg-brand-900/60 dark:text-brand-300">
                                            Konsultant
                                        </span>
                                    </template>
                                </div>
                                <span class="text-gray-400" x-text="new Date(msg.created_at).toLocaleString(locale)"></span>
                            </div>
                            <div class="text-gray-800 dark:text-gray-200 whitespace-pre-wrap" x-text="msg.content"></div>
                        </div>
                    </template>
                </div>

                <!-- FORMULARZ ODPOWIEDZI / NOTATKI -->
                <div class="p-4 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
                    <div class="flex items-center gap-2 mb-2">
                        <button type="button" @click="ticketDrawer.isInternal = false"
                                class="px-3 py-1 rounded-lg text-xs font-semibold transition"
                                :class="!ticketDrawer.isInternal ? 'bg-brand-600 text-white shadow-2xs' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600'">
                            <span x-text="window.ZenI18n.t('Odpowiedź do klienta')"></span>
                        </button>
                        <button type="button" @click="ticketDrawer.isInternal = true"
                                class="px-3 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1.5"
                                :class="ticketDrawer.isInternal ? 'bg-amber-600 text-white shadow-2xs' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600'">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            <span x-text="window.ZenI18n.t('Notatka wewnętrzna')"></span>
                        </button>
                    </div>

                    <div class="relative">
                        <textarea x-model="ticketDrawer.replyContent" rows="5"
                                  class="w-full min-h-[130px] p-3.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-inner resize-y transition font-sans leading-relaxed"
                                  :placeholder="ticketDrawer.isInternal ? window.ZenI18n.t('Wpisz treść notatki wewnętrznej (niewidoczna dla klienta)...') : window.ZenI18n.t('Wpisz treść odpowiedzi do klienta...')"></textarea>
                    </div>

                    <div class="flex items-center justify-between mt-2.5">
                        <span class="text-xs text-red-500 font-medium" x-show="ticketDrawer.error" x-text="ticketDrawer.error"></span>
                        <div class="flex-1"></div>
                        <button type="button" @click="sendTicketReply()"
                                :disabled="!ticketDrawer.replyContent || !ticketDrawer.replyContent.trim() || ticketDrawer.savingReply"
                                class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold rounded-lg text-white shadow-sm transition disabled:opacity-50"
                                :class="ticketDrawer.isInternal ? 'bg-amber-600 hover:bg-amber-700' : 'bg-brand-600 hover:bg-brand-700'">
                            <svg x-show="ticketDrawer.savingReply" class="w-4 h-4 animate-spin" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                            <span x-text="ticketDrawer.isInternal ? window.ZenI18n.t('Zapisz notatkę') : window.ZenI18n.t('Wyślij odpowiedź')"></span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ═══════════════ MODAL DODAWANIA TICKETU W CRM ═══════════════ -->
    <div x-show="ticketModal.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 md:p-6 bg-black/60 backdrop-blur-xs">
        <div class="w-full max-w-2xl bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden flex flex-col max-h-[92vh]">
            <div class="px-6 py-4.5 border-b border-gray-200 dark:border-gray-700/80 bg-gray-50/70 dark:bg-gray-800/60 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-950/60 dark:text-brand-300 border border-brand-100 dark:border-brand-800/60 flex items-center justify-center flex-shrink-0 shadow-2xs">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
                    </div>
                    <div>
                        <h3 class="text-base sm:text-lg font-bold text-gray-900 dark:text-gray-100" x-text="window.ZenI18n.t('Nowe zgłoszenie / ticket')">Nowe zgłoszenie / ticket</h3>
                        <p class="text-xs text-gray-500 dark:text-gray-400" x-text="window.ZenI18n.t('Wprowadź szczegóły problemu lub zapytania od klienta')"></p>
                    </div>
                </div>
                <button type="button" @click="closeNewTicketModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition" aria-label="Zamknij">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <form @submit.prevent="saveNewTicket()" class="p-6 space-y-4 overflow-y-auto flex-1">
                <div x-show="ticketModal.error" class="p-3.5 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 text-red-600 dark:text-red-400 text-xs font-medium" x-text="ticketModal.error"></div>

                <!-- Tytuł -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5"><span x-text="window.ZenI18n.t('Temat zgłoszenia')"></span> <span class="text-red-500 font-bold">*</span></label>
                    <input type="text" x-model="ticketModal.form.title" required
                           :placeholder="window.ZenI18n.t('np. Problem z integracją, pytanie o ofertę...')"
                           class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
                </div>

                <!-- Klient (opcjonalny) -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5" x-text="window.ZenI18n.t('Klient (opcjonalnie)')"></label>
                    <select x-model="ticketModal.form.client_id" @change="onTicketClientSelect($event.target.value)"
                            class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
                        <option value="" x-text="window.ZenI18n.t('— Brak powiązanego klienta —')"></option>
                        <template x-for="c in clients" :key="c.id">
                            <option :value="c.id" x-text="c.name + (c.company ? ' (' + c.company + ')' : '')"></option>
                        </template>
                    </select>
                </div>

                <!-- Dane kontaktowe -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5" x-text="window.ZenI18n.t('Imię i nazwisko zgłaszającego')"></label>
                        <input type="text" x-model="ticketModal.form.contact_name"
                               class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5" x-text="window.ZenI18n.t('E-mail zgłaszającego')"></label>
                        <input type="email" x-model="ticketModal.form.contact_email"
                               class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
                    </div>
                </div>

                <!-- Kategoria i Priorytet -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5" x-text="window.ZenI18n.t('Kategoria')"></label>
                        <select x-model="ticketModal.form.category"
                                class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
                            <template x-for="cat in ticketCategories" :key="cat.id">
                                <option :value="cat.id" x-text="cat.name"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5" x-text="window.ZenI18n.t('Priorytet')"></label>
                        <select x-model="ticketModal.form.priority"
                                class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
                            <option value="low" x-text="window.ZenI18n.t('Niski')"></option>
                            <option value="medium" x-text="window.ZenI18n.t('Średni')"></option>
                            <option value="high" x-text="window.ZenI18n.t('Wysoki')"></option>
                            <option value="urgent" x-text="window.ZenI18n.t('Pilny')"></option>
                        </select>
                    </div>
                </div>

                <!-- Opiekun i Zespół -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5" x-text="window.ZenI18n.t('Przypisz pracownika')"></label>
                        <select x-model="ticketModal.form.assignee_id"
                                class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
                            <option value="" x-text="window.ZenI18n.t('— Bez przypisania —')"></option>
                            <template x-for="u in users" :key="u.id">
                                <option :value="u.id" x-text="fullName(u)"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5" x-text="window.ZenI18n.t('Przypisz zespół')"></label>
                        <select x-model="ticketModal.form.team_id"
                                class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
                            <option value="" x-text="window.ZenI18n.t('— Brak zespołu —')"></option>
                            <template x-for="tm in teams" :key="tm.id">
                                <option :value="tm.id" x-text="tm.name"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- Opis zgłoszenia -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5" x-text="window.ZenI18n.t('Treść zgłoszenia / Opis')"></label>
                    <textarea x-model="ticketModal.form.description" rows="4"
                              :placeholder="window.ZenI18n.t('Szczegółowy opis problemu lub zapytania...')"
                              class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all"></textarea>
                </div>

                <!-- Przycisk zapisu -->
                <div class="flex items-center justify-end gap-2.5 pt-4 border-t border-gray-200 dark:border-gray-700">
                    <button type="button" @click="closeNewTicketModal()" class="px-4 py-2.5 text-xs font-semibold rounded-xl border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                        <span x-text="window.ZenI18n.t('Anuluj')">Anuluj</span>
                    </button>
                    <button type="submit" :disabled="ticketModal.saving" class="px-5 py-2.5 text-xs font-semibold rounded-xl bg-brand-600 hover:bg-brand-700 text-white shadow-xs disabled:opacity-50 transition flex items-center gap-2">
                        <svg x-show="ticketModal.saving" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        <span x-text="window.ZenI18n.t('Zapisz ticket')">Zapisz ticket</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
