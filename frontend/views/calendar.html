<!-- Kalendarz i pełna agenda wybranego dnia -->
<div :inert="detailView.open &amp;&amp; detailPanel" x-show="(!detailView.open || detailPanel) &amp;&amp; currentView === &#x27;meetings&#x27;" x-cloak class="zen-calendar">
<div class="zen-calendar-toolbar"><div><span class="ux-eyebrow"><span x-text="window.ZenI18n.t(&quot;Twój plan&quot;)">Twój plan</span></span><h2 x-text="monthLabel"></h2></div><div class="flex items-center gap-2 flex-wrap"><button class="zen-list-action" @click="prevMonth()" :aria-label="window.ZenI18n.t(&quot;Poprzedni miesiąc&quot;)"><span x-html="zenIcon(&#x27;left&#x27;)"></span></button><button class="ux-text-button" @click="calendarDate = new Date(); calendarSelected = new Date()"><span x-text="window.ZenI18n.t(&quot;Dzisiaj&quot;)">Dzisiaj</span></button><button class="zen-list-action" @click="nextMonth()" :aria-label="window.ZenI18n.t(&quot;Następny miesiąc&quot;)"><span x-html="zenIcon(&#x27;right&#x27;)"></span></button><button class="ux-button" @click="openModal(null,null,false,&#x27;meetings&#x27;)"><span x-text="window.ZenI18n.t(&quot;+ Spotkanie&quot;)">+ Spotkanie</span></button></div></div>
<div class="zen-calendar-filters"><template x-for="mode in [{id:&#x27;both&#x27;,label:window.ZenI18n.t(&#x27;Wszystko&#x27;)},{id:&#x27;meetings&#x27;,label:window.ZenI18n.t(&#x27;Spotkania&#x27;)},{id:&#x27;tasks&#x27;,label:window.ZenI18n.t(&#x27;Zadania&#x27;)}]" :key="mode.id"><button @click="calendarMode = mode.id" :aria-pressed="calendarMode === mode.id" x-text="mode.label"></button></template><span><i class="zen-event-dot"></i> <span x-text="window.ZenI18n.t(&quot;Spotkanie&quot;)">Spotkanie</span></span><span><i class="zen-event-dot task"></i> <span x-text="window.ZenI18n.t(&quot;Zadanie&quot;)">Zadanie</span></span></div>
<div class="zen-calendar-layout"><div class="zen-calendar-scroll"><div class="zen-calendar-month"><div class="zen-calendar-weekdays"><span><span class="zen-weekday-long"><span x-text="window.ZenI18n.t(&quot;Poniedziałek&quot;)">Poniedziałek</span></span><span class="zen-weekday-short" :aria-label="window.ZenI18n.t(&quot;Poniedziałek&quot;)"><span x-text="window.ZenI18n.t(&quot;Pn&quot;)">Pn</span></span></span><span><span class="zen-weekday-long"><span x-text="window.ZenI18n.t(&quot;Wtorek&quot;)">Wtorek</span></span><span class="zen-weekday-short" :aria-label="window.ZenI18n.t(&quot;Wtorek&quot;)"><span x-text="window.ZenI18n.t(&quot;Wt&quot;)">Wt</span></span></span><span><span class="zen-weekday-long"><span x-text="window.ZenI18n.t(&quot;Środa&quot;)">Środa</span></span><span class="zen-weekday-short" :aria-label="window.ZenI18n.t(&quot;Środa&quot;)"><span x-text="window.ZenI18n.t(&quot;Śr&quot;)">Śr</span></span></span><span><span class="zen-weekday-long"><span x-text="window.ZenI18n.t(&quot;Czwartek&quot;)">Czwartek</span></span><span class="zen-weekday-short" :aria-label="window.ZenI18n.t(&quot;Czwartek&quot;)"><span x-text="window.ZenI18n.t(&quot;Cz&quot;)">Cz</span></span></span><span><span class="zen-weekday-long"><span x-text="window.ZenI18n.t(&quot;Piątek&quot;)">Piątek</span></span><span class="zen-weekday-short" :aria-label="window.ZenI18n.t(&quot;Piątek&quot;)"><span x-text="window.ZenI18n.t(&quot;Pt&quot;)">Pt</span></span></span><span><span class="zen-weekday-long"><span x-text="window.ZenI18n.t(&quot;Sobota&quot;)">Sobota</span></span><span class="zen-weekday-short" :aria-label="window.ZenI18n.t(&quot;Sobota&quot;)"><span x-text="window.ZenI18n.t(&quot;So&quot;)">So</span></span></span><span><span class="zen-weekday-long"><span x-text="window.ZenI18n.t(&quot;Niedziela&quot;)">Niedziela</span></span><span class="zen-weekday-short" :aria-label="window.ZenI18n.t(&quot;Niedziela&quot;)"><span x-text="window.ZenI18n.t(&quot;Nd&quot;)">Nd</span></span></span></div><div class="zen-calendar-grid">
<template x-for="(day,idx) in calendarDays" :key="idx"><div class="zen-calendar-day" :class="{&#x27;outside&#x27;: !day.isCurrentMonth, &#x27;selected&#x27;: localDateKey(day.date) === localDateKey(calendarSelected)}"><button class="zen-day-number" :class="{&#x27;today&#x27;: localDateKey(day.date) === localDateKey(new Date())}" @click="calendarSelected = day.date" :aria-label="day.date.toLocaleDateString(locale)" :aria-pressed="localDateKey(day.date) === localDateKey(calendarSelected)" x-text="day.date.getDate()"></button><button class="zen-mobile-event-count" x-show="calendarEventsFor(day).length" @click="calendarSelected = day.date" :aria-label="calendarEventsFor(day).length + window.ZenI18n.t(&#x27; wydarzeń — pokaż plan dnia&#x27;)" x-text="calendarEventsFor(day).length"></button><template x-for="event in calendarEventsFor(day).slice(0,3)" :key="event._key"><button class="zen-calendar-event" :class="event._type" @click="openCalendarEvent(event)" :title="event._time + &#x27; &#x27; + event.title"><span x-text="event._time"></span><strong x-text="event.title"></strong></button></template><button class="zen-calendar-more" x-show="calendarEventsFor(day).length &gt; 3" @click="calendarSelected = day.date" x-text="&#x27;+&#x27; + (calendarEventsFor(day).length - 3) + window.ZenI18n.t(&#x27; więcej&#x27;)"></button></div></template>
</div></div></div><aside class="zen-calendar-agenda"><span class="ux-eyebrow"><span x-text="window.ZenI18n.t(&quot;Plan dnia&quot;)">Plan dnia</span></span><h3 x-text="calendarSelected.toLocaleDateString(locale,{weekday:&#x27;long&#x27;,day:&#x27;numeric&#x27;,month:&#x27;long&#x27;})"></h3><template x-for="event in calendarEventsFor({date:calendarSelected})" :key="event._key"><button class="zen-agenda-event" :class="event._type" @click="openCalendarEvent(event)"><span class="zen-icon-wrap" x-html="zenIcon(event._type === &#x27;task&#x27; ? &#x27;check&#x27; : &#x27;calendar&#x27;)"></span><span><small x-text="event._time + &#x27; · &#x27; + (event._type === &#x27;task&#x27; ? window.ZenI18n.t(&#x27;Zadanie&#x27;) : window.ZenI18n.t(&#x27;Spotkanie&#x27;))"></small><strong x-text="event.title"></strong></span></button></template><p class="ux-muted" x-show="!calendarEventsFor({date:calendarSelected}).length"><span x-text="window.ZenI18n.t(&quot;Brak zaplanowanych wydarzeń. Masz wolny dzień.&quot;)">Brak zaplanowanych wydarzeń. Masz wolny dzień.</span></p></aside></div></div>
