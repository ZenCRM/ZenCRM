<div class="plugin-drive">
    <div class="plugin-drive-banner"><div><span class="plugin-drive-mark" aria-hidden="true">GD</span><h4 x-text="window.ZenI18n.t('Twój dysk, połączony z CRM')"></h4><p x-text="window.ZenI18n.t('Przechowuj pliki i raporty w folderze ZenCRM na swoim Dysku Google. Dostęp obejmuje wyłącznie pliki tej integracji.')"></p></div><span class="plugin-status" :class="{'is-enabled':driveStatus?.connected}" x-text="window.ZenI18n.t(driveStatus?.connected ? 'Połączono' : 'Niepołączono')"></span></div>
    <p role="alert" class="plugin-alert" x-show="driveError" x-text="driveError"></p><p role="status" class="plugin-drive-message" x-show="message" x-text="message"></p>
    <div x-show="driveStatus && !driveStatus.configured" class="plugin-empty"><h4 x-text="window.ZenI18n.t('Integracja wymaga konfiguracji administratora')"></h4><p x-text="window.ZenI18n.t('Administrator musi ustawić klienta OAuth Google i włączyć Drive API. Po konfiguracji połączysz tutaj swoje konto.')"></p><div x-show="user?.role === 'admin'" class="plugin-drive-setup"><p x-text="window.ZenI18n.t('Adres powrotu OAuth do wpisania w Google Cloud')"></p><code x-text="driveStatus?.callback_uri || window.ZenI18n.t('Ustaw najpierw adres CRM w ustawieniach firmy.')"></code><p x-text="window.ZenI18n.t('Instrukcja instalacji: GOOGLE_DRIVE.md w repozytorium projektu.')"></p></div></div>
    <div x-show="driveStatus?.configured && !driveStatus.connected" class="plugin-drive-connect"><p x-text="window.ZenI18n.t('Połącz swoje konto Google. Hasło i tokeny nie trafiają do przeglądarki CRM.')"></p><button type="button" class="plugin-button plugin-primary" :disabled="busy" @click="connect()" x-text="window.ZenI18n.t('Połącz konto Google')"></button></div>
    <div x-show="driveStatus?.connected">
        <div class="plugin-drive-toolbar"><form @submit.prevent="refresh()"><input type="search" x-model="search" maxlength="120" :aria-label="window.ZenI18n.t('Szukaj plików')" :placeholder="window.ZenI18n.t('Szukaj plików')"><button type="submit" class="plugin-button" :disabled="busy" x-text="window.ZenI18n.t('Szukaj')"></button></form><div><button type="button" class="plugin-button plugin-primary" :disabled="busy" @click="$refs.driveUpload.click()" x-text="window.ZenI18n.t('Wyślij plik')"></button><input type="file" hidden x-ref="driveUpload" @change="uploadSelected($event)"><button type="button" class="plugin-button" :disabled="busy" @click="disconnect()" x-text="window.ZenI18n.t('Odłącz konto Google')"></button></div></div>
        <p class="plugin-report-note" x-text="window.ZenI18n.t('Pliki do 10 MB. Zapisane raporty znajdziesz również tutaj. Odłączenie nie usuwa plików z dysku.')"></p>
        <p x-show="!files.length && !busy" class="plugin-empty" x-text="window.ZenI18n.t('Nie masz jeszcze plików tej integracji. Wyślij plik lub zapisz raport ze Studia raportów.')"></p>
        <div class="plugin-report-table-wrap"><table class="plugin-report-table" x-show="files.length"><thead><tr><th x-text="window.ZenI18n.t('Nazwa pliku')"></th><th x-text="window.ZenI18n.t('Rozmiar')"></th><th x-text="window.ZenI18n.t('Otwórz')"></th></tr></thead><tbody><template x-for="file in files" :key="file.id"><tr><td><strong x-text="file.name"></strong><p class="plugin-report-note" x-text="file.modifiedTime"></p></td><td x-text="fileSize(file)"></td><td><a class="plugin-button" :href="fileURL(file)" x-show="fileURL(file)" target="_blank" rel="noopener noreferrer" x-text="window.ZenI18n.t('Otwórz na Dysku Google')"></a></td></tr></template></tbody></table></div>
        <div class="plugin-slot-pager"><span x-text="pageIndex + 1"></span><div><button type="button" class="plugin-button" :disabled="busy || !pageIndex" @click="previous()" x-text="window.ZenI18n.t('Poprzednia')"></button><button type="button" class="plugin-button" :disabled="busy || !nextPage" @click="next()" x-text="window.ZenI18n.t('Następna')"></button></div></div>
    </div><p role="status" x-show="busy" class="plugin-report-note" x-text="window.ZenI18n.t('Ładowanie aplikacji…')"></p>
</div>
