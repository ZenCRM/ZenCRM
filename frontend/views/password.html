<!-- ═══════════════ MODAL ZMIANY HASŁA ═══════════════ -->
<div x-show="password.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
     @keydown.escape.window="password.open = false">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <h3 class="text-lg font-semibold"><span x-text="window.ZenI18n.t(&quot;Zmień hasło&quot;)">Zmień hasło</span></h3>
            <button @click="password.open = false" class="text-2xl leading-none hover:text-red-500">&times;</button>
        </div>
        <form @submit.prevent="savePassword()" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1"><span x-text="window.ZenI18n.t(&quot;Nowe hasło&quot;)">Nowe hasło</span></label>
                <input type="password" x-model="password.form.new_password" required minlength="6"
                       class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1"><span x-text="window.ZenI18n.t(&quot;Powtórz nowe hasło&quot;)">Powtórz nowe hasło</span></label>
                <input type="password" x-model="password.form.confirm" required minlength="6"
                       class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <p x-show="password.error" x-text="password.error" class="text-red-500 text-sm"></p>
            <p x-show="password.success" class="text-green-600 text-sm"><span class="zen-icon-wrap" x-html="zenIcon(&#x27;check&#x27;)" aria-hidden="true"></span> <span x-text="password.success"></span></p>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" @click="password.open = false"
                        class="px-4 py-2 rounded-lg border dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700"><span x-text="window.ZenI18n.t(&quot;Anuluj&quot;)">Anuluj</span></button>
                <button type="submit"
                        class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium"><span x-text="window.ZenI18n.t(&quot;Zmień hasło&quot;)">Zmień hasło</span></button>
            </div>
        </form>
    </div>
</div>
