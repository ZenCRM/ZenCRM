<!-- ═══════════════ MODAL ZMIANY HASŁA ═══════════════ -->
<div x-show="password.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4"
     @keydown.escape.window="password.open = false">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-md overflow-hidden">
        <div class="px-6 py-4.5 border-b border-gray-200 dark:border-gray-700/80 bg-gray-50/70 dark:bg-gray-800/60 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-950/60 dark:text-brand-300 border border-brand-100 dark:border-brand-800/60 flex items-center justify-center flex-shrink-0 shadow-2xs">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                </div>
                <div>
                    <h3 class="text-base font-bold text-gray-900 dark:text-gray-100" x-text="window.ZenI18n.t('Zmień hasło')">Zmień hasło</h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400" x-text="window.ZenI18n.t('Ustaw nowe bezpieczne hasło do konta')"></p>
                </div>
            </div>
            <button type="button" @click="password.open = false" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition" :aria-label="window.ZenI18n.t(&quot;Zamknij&quot;)">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <form @submit.prevent="savePassword()" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5"><span x-text="window.ZenI18n.t('Nowe hasło')">Nowe hasło</span> <span class="text-red-500 font-bold">*</span></label>
                <input type="password" x-model="password.form.new_password" required minlength="6"
                       :placeholder="window.ZenI18n.t(&quot;Min. 6 znaków&quot;)"
                       class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5"><span x-text="window.ZenI18n.t('Powtórz nowe hasło')">Powtórz nowe hasło</span> <span class="text-red-500 font-bold">*</span></label>
                <input type="password" x-model="password.form.confirm" required minlength="6"
                       :placeholder="window.ZenI18n.t(&quot;Powtórz hasło&quot;)"
                       class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
            </div>

            <p x-show="password.error" x-text="password.error" class="p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 text-red-600 dark:text-red-400 text-xs font-medium"></p>
            <p x-show="password.success" class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 text-emerald-700 dark:text-emerald-300 text-xs font-medium flex items-center gap-1.5"><span class="zen-icon-wrap" x-html="zenIcon('check')" aria-hidden="true"></span> <span x-text="password.success"></span></p>

            <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-gray-200 dark:border-gray-700">
                <button type="button" @click="password.open = false"
                        class="px-4 py-2.5 text-xs font-semibold rounded-xl border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <span x-text="window.ZenI18n.t('Anuluj')">Anuluj</span>
                </button>
                <button type="submit"
                        class="px-5 py-2.5 text-xs font-semibold rounded-xl bg-brand-600 hover:bg-brand-700 text-white shadow-xs transition">
                    <span x-text="window.ZenI18n.t('Zmień hasło')">Zmień hasło</span>
                </button>
            </div>
        </form>
    </div>
</div>
