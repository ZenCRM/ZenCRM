<!-- ═══ PRACOWNICY I ZESPOŁY ═══ -->
<div :inert="detailView.open &amp;&amp; detailPanel" x-show="(!detailView.open || detailPanel) &amp;&amp; currentView === 'users'" x-cloak class="employee-directory space-y-4">
    <div class="employee-heading"><div><h2 x-text="window.ZenI18n.t('Pracownicy i zespoły')"></h2><p x-text="window.ZenI18n.t('Poznaj zespół, sprawdź role i zarządzaj profilami pracowników.')"></p></div><div class="employee-summary"><span><strong x-text="users.filter(u => u.is_active).length"></strong><span x-text="window.ZenI18n.t('Aktywne konta')"></span></span><span><strong x-text="teams.length"></strong><span x-text="window.ZenI18n.t('Zespoły')"></span></span></div></div>
    <!-- Pasek zakładek i akcji -->
    <div class="employee-toolbar flex items-center justify-between gap-4 flex-wrap pb-1 border-b border-gray-200 dark:border-gray-700">
        <!-- Zakładki -->
        <div class="flex items-center gap-2">
            <button type="button" @click="userTab = 'employees'"
                    :class="userTab === 'employees' ? 'border-brand-600 text-brand-600 dark:text-brand-400 font-bold border-b-2' : 'text-gray-500 hover:text-gray-700 dark:text-gray-400'"
                    class="px-3 py-2 text-sm transition flex items-center gap-2 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                <span x-text="window.ZenI18n.t('Pracownicy')">Pracownicy</span>
                <span class="px-2 py-0.5 rounded-full text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 font-semibold" x-text="(users || []).length"></span>
            </button>
            <button type="button" @click="userTab = 'teams'"
                    :class="userTab === 'teams' ? 'border-brand-600 text-brand-600 dark:text-brand-400 font-bold border-b-2' : 'text-gray-500 hover:text-gray-700 dark:text-gray-400'"
                    class="px-3 py-2 text-sm transition flex items-center gap-2 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                <span x-text="window.ZenI18n.t('Zespoły')">Zespoły</span>
                <span class="px-2 py-0.5 rounded-full text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 font-semibold" x-text="(teams || []).length"></span>
            </button>
        </div>

        <!-- Przyciski akcji -->
        <div class="flex items-center gap-2">
            <template x-if="userTab === 'employees'">
                <div class="flex items-center gap-2 flex-wrap">
                    <input type="search" class="ux-input text-xs" x-model.debounce.150ms="userSearch" :placeholder="window.ZenI18n.t('Szukaj pracownika...')" :aria-label="window.ZenI18n.t('Szukaj pracownika')">
                    <select class="ux-input text-xs" x-model="userTeamFilter" :aria-label="window.ZenI18n.t('Filtruj wg zespołu')">
                        <option value="" x-text="window.ZenI18n.t('Wszystkie zespoły')">Wszystkie zespoły</option>
                        <template x-for="t in teams" :key="'opt-team-' + t.id">
                            <option :value="t.id" x-text="t.name"></option>
                        </template>
                    </select>
                    <select class="ux-input text-xs" x-model="userStatusFilter" :aria-label="window.ZenI18n.t('Status konta')"><option value="" x-text="window.ZenI18n.t('Wszystkie konta')"></option><option value="active" x-text="window.ZenI18n.t('Aktywne')"></option><option value="inactive" x-text="window.ZenI18n.t('Nieaktywne')"></option></select>
                    <button type="button" @click="openModal(null, null, false, 'users')"
                            x-show="isAdmin"
                            class="px-3.5 py-2 bg-brand-600 hover:bg-brand-700 !text-white text-xs font-semibold rounded-lg shadow-sm transition flex items-center gap-1.5 cursor-pointer">
                        <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        <span class="text-white" x-text="window.ZenI18n.t('Dodaj pracownika')">Dodaj pracownika</span>
                    </button>
                </div>
            </template>
            <template x-if="userTab === 'teams'">
                <button type="button" @click="openTeamModal()"
                        class="px-3.5 py-2 bg-brand-600 hover:bg-brand-700 !text-white text-xs font-semibold rounded-lg shadow-sm transition flex items-center gap-1.5 cursor-pointer">
                    <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    <span class="text-white" x-text="window.ZenI18n.t('Dodaj zespół')">Dodaj zespół</span>
                </button>
            </template>
        </div>
    </div>

    <!-- ─────────────────────────────────────────────────────────── -->
    <!-- 1. ZAKŁADKA PRACOWNICY -->
    <!-- ─────────────────────────────────────────────────────────── -->
    <div x-show="userTab === 'employees'" class="space-y-4">
        <p class="employee-result-count" role="status" x-text="window.ZenI18n.t('Wyświetlono {count} z {total}', {count: filteredUsers.length, total: users.length})"></p>
        <div class="employee-grid">
            <template x-for="u in pagedItems('users', filteredUsers)" :key="u.id">
                <div class="employee-card" :class="{'is-inactive': !u.is_active}">
                    <div>
                        <span class="employee-account-status" :class="u.is_active ? 'is-active' : 'is-disabled'" x-text="window.ZenI18n.t(u.is_active ? 'Aktywne konto' : 'Nieaktywne konto')"></span>
                        <template x-if="u.avatar_url">
                            <img :src="u.avatar_url" :alt="fullName(u)" loading="lazy" class="w-16 h-16 rounded-full object-cover mx-auto mb-3 shadow-sm border border-gray-100 dark:border-gray-700">
                        </template>
                        <template x-if="!u.avatar_url">
                            <div class="w-16 h-16 rounded-full avatar-gradient text-white mx-auto flex items-center justify-center text-2xl font-bold mb-3 shadow-sm" x-text="initialsFrom(u)"></div>
                        </template>
                        <p class="font-bold text-gray-900 dark:text-gray-100 text-base" x-text="fullName(u)"></p>
                        <p class="employee-email" x-text="u.email"></p>

                        <div class="flex items-center justify-center gap-1.5 flex-wrap mb-3">
                            <span class="px-2.5 py-0.5 text-xs rounded-full font-medium inline-block"
                                  :class="{'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300': u.role === 'admin', 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300': u.role === 'manager', 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300': u.role === 'employee'}"
                                  x-text="roleLabel(u.role)"></span>
                        </div>

                        <!-- Zespoły pracownika -->
                        <div class="min-h-[26px] mb-3 flex items-center justify-center gap-1 flex-wrap">
                            <template x-for="tm in (u.teams || [])" :key="'u-' + u.id + '-t-' + tm.id">
                                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold"
                                      :style="{ backgroundColor: (tm.color || '#018bfc') + '15', color: tm.color || '#018bfc', border: '1px solid ' + (tm.color || '#018bfc') + '35' }">
                                    <span class="w-1.5 h-1.5 rounded-full" :style="{ backgroundColor: tm.color || '#018bfc' }"></span>
                                    <span x-text="tm.name"></span>
                                </span>
                            </template>
                            <span x-show="!(u.teams || []).length" class="text-xs text-gray-400 italic" x-text="window.ZenI18n.t('Brak zespołu')">Brak zespołu</span>
                        </div>

                        <!-- Telefony pracownika (Android) - widoczne tylko dla danego użytkownika -->
                        <div x-show="u.id === user?.id && (u.devices || []).length > 0" class="mb-3 flex items-center justify-center gap-1 flex-wrap text-xs">
                            <template x-for="d in (u.devices || [])" :key="'u-' + u.id + '-d-' + d.id">
                                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/40">
                                    <span class="w-1.5 h-1.5 rounded-full" :class="d.is_online ? 'bg-emerald-500 animate-pulse' : 'bg-gray-400'"></span>
                                    <span x-text="d.name + (d.phone_number ? ' (' + d.phone_number + ')' : '')"></span>
                                </span>
                            </template>
                        </div>
                    </div>

                    <div class="employee-card-actions" x-show="isAdmin">
                        <button @click="openModal(u, null, false, 'users')" class="zen-list-action zen-action-edit" :aria-label="window.ZenI18n.t('Edytuj')" :title="window.ZenI18n.t('Edytuj')"><span x-html="zenIcon('edit')" aria-hidden="true"></span><span x-text="window.ZenI18n.t('Edytuj')"></span></button><button type="button" class="employee-avatar-action" @click="openEmployeeAvatar(u)" :aria-label="window.ZenI18n.t('Zdjęcie pracownika') + ': ' + fullName(u)"><span x-text="window.ZenI18n.t('Zdjęcie')"></span></button>
                    </div>
                </div>
            </template>
        </div>

        <div x-show="filteredUsers.length === 0" class="text-center py-12 bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700">
            <p class="text-sm font-medium text-gray-500" x-text="window.ZenI18n.t('Brak pracowników spełniających kryteria')">Brak pracowników spełniających kryteria</p>
            <button x-show="userSearch || userTeamFilter || userStatusFilter" @click="userSearch = ''; userTeamFilter = ''; userStatusFilter = '';" class="mt-2 text-xs text-brand-600 dark:text-brand-400 hover:underline cursor-pointer" x-text="window.ZenI18n.t('Wyczyść filtry')">Wyczyść filtry</button>
        </div>
        <div x-data="{ pagerView: 'users', get pagerItems() { return this.filteredUsers } }"><% include "views/pagination.html" %></div>
    </div>

    <div x-show="employeeAvatar.open" x-cloak class="employee-avatar-overlay" @keydown.escape.stop="closeEmployeeAvatar()" @click.self="closeEmployeeAvatar()">
        <section class="employee-avatar-dialog" role="dialog" aria-modal="true" aria-labelledby="employee-avatar-title" @keydown.tab="trapEmployeeAvatarFocus($event)">
            <header><div><h3 id="employee-avatar-title" x-text="window.ZenI18n.t('Zdjęcie pracownika')"></h3><p x-text="fullName(employeeAvatar.user || {})"></p></div><button type="button" @click="closeEmployeeAvatar()" :disabled="employeeAvatar.busy" :aria-label="window.ZenI18n.t('Zamknij')">&times;</button></header>
            <div class="employee-avatar-preview"><template x-if="!employeeAvatar.remove && (employeeAvatar.preview || employeeAvatar.user?.avatar_url)"><img :src="employeeAvatar.preview || employeeAvatar.user.avatar_url" :alt="fullName(employeeAvatar.user || {})"></template><template x-if="employeeAvatar.remove || !(employeeAvatar.preview || employeeAvatar.user?.avatar_url)"><span class="avatar-gradient" x-text="initialsFrom(employeeAvatar.user || {})"></span></template></div>
            <p class="employee-avatar-hint" x-text="window.ZenI18n.t('PNG, JPG, GIF lub WEBP, maksymalnie 2 MB. Zdjęcie zostanie dopasowane automatycznie.')"></p>
            <div class="employee-avatar-controls"><label class="employee-file-button" :class="{'is-busy':employeeAvatar.busy}"><span x-text="window.ZenI18n.t('Wybierz zdjęcie')"></span><input type="file" accept="image/png,image/jpeg,image/gif,image/webp" @change="selectEmployeeAvatar($event)" :disabled="employeeAvatar.busy"></label><button type="button" @click="markEmployeeAvatarRemoved()" :disabled="employeeAvatar.busy" x-show="!employeeAvatar.remove && (employeeAvatar.preview || employeeAvatar.user?.avatar_url)" x-text="window.ZenI18n.t('Usuń zdjęcie')"></button></div>
            <p class="employee-avatar-error" role="alert" x-show="employeeAvatar.error" x-text="employeeAvatar.error"></p>
            <footer><button type="button" @click="closeEmployeeAvatar()" :disabled="employeeAvatar.busy" x-text="window.ZenI18n.t('Anuluj')"></button><button type="button" class="employee-avatar-save" @click="saveEmployeeAvatar()" :disabled="employeeAvatar.busy || (!employeeAvatar.file && !employeeAvatar.remove)" :aria-busy="employeeAvatar.busy" x-text="window.ZenI18n.t(employeeAvatar.busy ? 'Zapisywanie…' : 'Zapisz zmiany')"></button></footer>
        </section>
    </div>

    <!-- ─────────────────────────────────────────────────────────── -->
    <!-- 2. ZAKŁADKA ZESPOŁY -->
    <!-- ─────────────────────────────────────────────────────────── -->
    <div x-show="userTab === 'teams'" class="space-y-4">
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <template x-for="team in teams" :key="'team-card-' + team.id">
                <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <!-- Kolorowy pasek zespołu -->
                    <div class="h-2 w-full" :style="{ backgroundColor: team.color || '#018bfc' }"></div>

                    <div class="p-5 flex-1">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <div class="flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full" :style="{ backgroundColor: team.color || '#018bfc' }"></span>
                                <h3 class="font-bold text-gray-900 dark:text-gray-100 text-lg" x-text="team.name"></h3>
                            </div>
                            <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300"
                                  x-text="(team.member_ids || []).length + ' ' + window.ZenI18n.t('członków')"></span>
                        </div>

                        <p class="text-xs text-gray-500 dark:text-gray-400 mb-4 line-clamp-2" x-text="team.description || window.ZenI18n.t('Brak opisu zespołu')"></p>

                        <!-- Lider zespołu -->
                        <div class="mb-4 pt-3 border-t border-gray-100 dark:border-gray-700/60">
                            <div class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-1.5" x-text="window.ZenI18n.t('Lider zespołu')">Lider zespołu</div>
                            <template x-if="team.leader">
                                <div class="flex items-center gap-2">
                                    <template x-if="team.leader.avatar_url">
                                        <img :src="team.leader.avatar_url" class="w-6 h-6 rounded-full object-cover">
                                    </template>
                                    <template x-if="!team.leader.avatar_url">
                                        <div class="w-6 h-6 rounded-full avatar-gradient text-white flex items-center justify-center text-[9px] font-bold" x-text="initialsFrom(team.leader)"></div>
                                    </template>
                                    <span class="text-xs font-semibold text-gray-800 dark:text-gray-200" x-text="fullName(team.leader)"></span>
                                </div>
                            </template>
                            <span x-show="!team.leader" class="text-xs text-gray-400 italic" x-text="window.ZenI18n.t('Nie przypisano lidera')">Nie przypisano lidera</span>
                        </div>

                        <!-- Członkowie zespołu -->
                        <div>
                            <div class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-2" x-text="window.ZenI18n.t('Członkowie')">Członkowie</div>
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <template x-for="m in (team.members || []).slice(0, 6)" :key="'tm-m-' + m.id">
                                    <div class="flex items-center gap-1 bg-gray-50 dark:bg-gray-700/50 px-2 py-1 rounded-md text-xs border border-gray-200 dark:border-gray-600" :title="m.email">
                                        <template x-if="m.avatar_url">
                                            <img :src="m.avatar_url" class="w-4 h-4 rounded-full object-cover">
                                        </template>
                                        <template x-if="!m.avatar_url">
                                            <span class="w-4 h-4 rounded-full avatar-gradient text-white flex items-center justify-center text-[8px] font-bold" x-text="initialsFrom(m)"></span>
                                        </template>
                                        <span class="text-[11px] text-gray-800 dark:text-gray-200" x-text="fullName(m)"></span>
                                    </div>
                                </template>
                                <span x-show="(team.members || []).length > 6" class="text-xs text-gray-400 font-semibold self-center" x-text="'+' + ((team.members || []).length - 6)"></span>
                                <span x-show="!(team.members || []).length" class="text-xs text-gray-400 italic" x-text="window.ZenI18n.t('Brak przypisanych członków')">Brak przypisanych członków</span>
                            </div>
                        </div>
                    </div>

                    <!-- Przyciski akcji zespołu -->
                    <div class="px-5 py-3 bg-gray-50 dark:bg-gray-800/60 border-t border-gray-100 dark:border-gray-700 flex items-center justify-between">
                        <button type="button" @click="openTeamModal(team)"
                                class="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1 cursor-pointer">
                            <span x-html="zenIcon('edit')"></span>
                            <span x-text="window.ZenI18n.t('Edytuj zespół')">Edytuj zespół</span>
                        </button>
                        <button type="button" @click="deleteTeam(team.id)"
                                class="text-xs font-semibold text-red-500 hover:text-red-700 flex items-center gap-1 cursor-pointer">
                            <span x-html="zenIcon('trash')"></span>
                            <span x-text="window.ZenI18n.t('Usuń')">Usuń</span>
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <div x-show="teams.length === 0" class="text-center py-12 bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700">
            <svg class="w-12 h-12 text-gray-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <h4 class="font-bold text-gray-800 dark:text-gray-200 text-base" x-text="window.ZenI18n.t('Brak utworzonych zespołów')">Brak utworzonych zespołów</h4>
            <p class="text-xs text-gray-500 mt-1 mb-4" x-text="window.ZenI18n.t('Możesz podzielić pracowników na zespoły np. Sprzedaż, Wsparcie, Realizacja.')">Możesz podzielić pracowników na zespoły np. Sprzedaż, Wsparcie, Realizacja.</p>
            <button type="button" @click="openTeamModal()"
                    class="px-4 py-2 bg-brand-600 hover:bg-brand-700 !text-white text-xs font-semibold rounded-lg shadow-sm transition inline-flex items-center gap-1.5 cursor-pointer">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                <span class="text-white" x-text="window.ZenI18n.t('Utwórz pierwszy zespół')">Utwórz pierwszy zespół</span>
            </button>
        </div>
    </div>

    <!-- ─────────────────────────────────────────────────────────── -->
    <!-- 3. MODAL TWORZENIA / EDYCJI ZESPOŁU -->
    <!-- ─────────────────────────────────────────────────────────── -->
    <div x-show="teamModal.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
         @keydown.escape.window="closeTeamModal()">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100"
                    x-text="teamModal.editingId ? window.ZenI18n.t('Edytuj zespół') : window.ZenI18n.t('Nowy zespół')"></h3>
                <button type="button" @click="closeTeamModal()" class="text-2xl leading-none hover:text-red-500 text-gray-400 cursor-pointer">&times;</button>
            </div>

            <form @submit.prevent="saveTeamModal()" class="p-6 space-y-4 overflow-y-auto flex-1">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        <span x-text="window.ZenI18n.t('Nazwa zespołu')">Nazwa zespołu</span>
                        <span class="text-red-500 font-bold">*</span>
                    </label>
                    <input type="text" x-model="teamModal.form.name" required
                           class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all"
                           :placeholder="window.ZenI18n.t('np. Dział Sprzedaży')">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        <span x-text="window.ZenI18n.t('Kolor zespołu')">Kolor zespołu</span>
                    </label>
                    <div class="flex items-center gap-3">
                        <input type="color" x-model="teamModal.form.color" class="w-10 h-10 p-0.5 rounded-xl cursor-pointer border border-gray-300 dark:border-gray-600 shadow-2xs">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <template x-for="c in ['#018bfc', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b']" :key="'col-' + c">
                                <button type="button" @click="teamModal.form.color = c"
                                        class="w-7 h-7 rounded-full border-2 transition cursor-pointer hover:scale-105"
                                        :style="{ backgroundColor: c, borderColor: teamModal.form.color === c ? '#000' : 'transparent' }"></button>
                            </template>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        <span x-text="window.ZenI18n.t('Opiekun / Lider zespołu')">Opiekun / Lider zespołu</span>
                    </label>
                    <select x-model="teamModal.form.leader_id" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all">
                        <option :value="null" x-text="window.ZenI18n.t('Brak lidera')">Brak lidera</option>
                        <template x-for="u in users" :key="'ldr-' + u.id">
                            <option :value="u.id" x-text="fullName(u) + ' (' + u.email + ')'"></option>
                        </template>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        <span x-text="window.ZenI18n.t('Opis')">Opis</span>
                    </label>
                    <textarea x-model="teamModal.form.description" rows="2"
                              class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-750 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 shadow-2xs transition-all"
                              :placeholder="window.ZenI18n.t('Opis zadań i odpowiedzialności zespołu...')"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        <span x-text="window.ZenI18n.t('Członkowie zespołu')">Członkowie zespołu</span>
                    </label>
                    <div class="max-h-48 overflow-y-auto border border-gray-200 dark:border-gray-700 rounded-xl p-2.5 space-y-1 bg-gray-50/60 dark:bg-gray-900/40">
                        <template x-for="u in users" :key="'chk-usr-' + u.id">
                            <label class="flex items-center gap-2.5 p-2 rounded-lg hover:bg-white dark:hover:bg-gray-800 cursor-pointer transition">
                                <input type="checkbox" :checked="isTeamMember(u.id)" @change="toggleTeamMember(u.id)"
                                       class="rounded text-brand-600 focus:ring-brand-500 w-4 h-4">
                                <template x-if="u.avatar_url">
                                    <img :src="u.avatar_url" class="w-6 h-6 rounded-full object-cover">
                                </template>
                                <template x-if="!u.avatar_url">
                                    <span class="w-6 h-6 rounded-full avatar-gradient text-white flex items-center justify-center text-[9px] font-bold" x-text="initialsFrom(u)"></span>
                                </template>
                                <span class="text-xs font-semibold text-gray-800 dark:text-gray-200" x-text="fullName(u)"></span>
                                <span class="text-[11px] text-gray-400 ml-auto" x-text="roleLabel(u.role)"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <p x-show="teamModal.error" x-text="teamModal.error" class="p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 text-red-600 dark:text-red-400 text-xs font-medium"></p>

                <div class="flex items-center justify-end gap-2.5 pt-4 border-t border-gray-200 dark:border-gray-700">
                    <button type="button" @click="closeTeamModal()"
                            class="px-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 text-xs font-semibold transition cursor-pointer">
                        <span x-text="window.ZenI18n.t('Anuluj')">Anuluj</span>
                    </button>
                    <button type="submit" :disabled="teamModal.saving"
                            class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold cursor-pointer disabled:opacity-50 disabled:cursor-wait transition shadow-xs">
                        <span x-text="teamModal.editingId ? window.ZenI18n.t('Zapisz zmiany') : window.ZenI18n.t('Utwórz zespół')">Zapisz zmiany</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
