<div x-show="generateModal.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" @keydown.escape.window="generateModal.open = false">
    <form @submit.prevent="submitGeneration()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-6 space-y-4">
        <div class="flex justify-between items-center"><h3 class="text-lg font-bold" x-text="window.ZenI18n.t('Generuj dokument')">Generuj dokument</h3><button type="button" @click="generateModal.open = false" class="text-2xl" aria-label="Zamknij">×</button></div>
        <label class="block text-sm"><span x-text="window.ZenI18n.t('Szablon')">Szablon</span><select class="ux-input w-full mt-1" x-model="generateModal.templateId" required><option value="">— wybierz —</option><template x-for="tpl in templates.filter(t => t.type === generateModal.type && t.is_active && (generateModal.type !== 'document' || !t.document_type_key || t.document_type_key === generateModal.item?.type))" :key="tpl.id"><option :value="tpl.id" x-text="tpl.name"></option></template></select></label>
        <div x-show="generationTypeFields().length" class="space-y-3 border-t pt-3"><h4 class="font-semibold text-sm" x-text="'Pola typu: ' + documentTypeLabel(generateModal.item?.type)"></h4><template x-for="field in generationTypeFields()" :key="field.key"><label class="block text-sm"><span x-text="field.label + (field.required ? ' *' : '')"></span><code class="ml-2 text-xs" x-text="'{{ type_fields.' + field.key + ' }}'"></code><template x-if="field.kind === 'textarea'"><textarea class="ux-input w-full mt-1" x-model="generateModal.typeFields[field.key]" :required="field.required"></textarea></template><template x-if="field.kind === 'select'"><select class="ux-input w-full mt-1" x-model="generateModal.typeFields[field.key]" :required="field.required"><option value="">— wybierz —</option><template x-for="option in field.options" :key="option"><option :value="option" x-text="option"></option></template></select></template><input x-show="field.kind === 'boolean'" type="checkbox" x-model="generateModal.typeFields[field.key]"><template x-if="!['textarea','select','boolean'].includes(field.kind)"><input :type="field.kind" class="ux-input w-full mt-1" x-model="generateModal.typeFields[field.key]" :required="field.required"></template></label></template></div>
        <template x-for="field in generationFields()" :key="field.name"><label class="block text-sm"><span x-text="field.label"></span><code class="ml-2 text-xs" x-text="'{{ custom.' + field.name + ' }}'"></code><input class="ux-input w-full mt-1" x-model="generateModal.custom[field.name]"></label></template>
        <p x-show="generateModal.error" x-text="generateModal.error" class="text-red-600" role="alert"></p>
        <div class="flex justify-end gap-2"><button type="button" class="ux-text-button" @click="generateModal.open = false" x-text="window.ZenI18n.t('Anuluj')">Anuluj</button><button type="submit" class="ux-button" x-text="window.ZenI18n.t('Generuj')">Generuj</button></div>
    </form>
</div>
