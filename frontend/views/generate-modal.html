<div x-show="generateModal.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" @keydown.escape.window="generateModal.open = false">
    <form @submit.prevent="submitGeneration()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-5 sm:p-6 space-y-5">
        <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-4"><h3 class="text-lg font-bold" x-text="window.ZenI18n.t('Generuj dokument')">Generuj dokument</h3><button type="button" @click="generateModal.open = false" class="text-2xl text-gray-400 hover:text-gray-700" aria-label="Zamknij">×</button></div>
        <label class="block text-sm"><span class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5" x-text="window.ZenI18n.t('Szablon')">Szablon</span><select class="ux-input w-full" x-model="generateModal.templateId" required><option value="">— wybierz —</option><template x-for="tpl in templates.filter(t => t.type === generateModal.type && t.is_active && (generateModal.type !== 'document' || !t.document_type_key || t.document_type_key === generateModal.item?.type))" :key="tpl.id"><option :value="tpl.id" x-text="tpl.name"></option></template></select></label>
        <div x-show="generationTypeFields().length" class="rounded-2xl border border-brand-100 dark:border-brand-900/50 bg-brand-50/40 dark:bg-gray-750 p-4 space-y-4"><h4 class="font-semibold text-sm" x-text="documentTypeLabel(generateModal.item?.type)"></h4><div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><template x-for="field in generationTypeFields()" :key="field.key"><div :class="field.kind === 'textarea' ? 'sm:col-span-2' : ''"><template x-if="field.kind === 'boolean'"><label class="flex items-center gap-3 min-h-11 px-3 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 cursor-pointer"><input type="checkbox" class="w-4 h-4 rounded text-brand-600" x-model="generateModal.typeFields[field.key]"><span class="text-sm font-medium" x-text="field.label"></span></label></template><template x-if="field.kind !== 'boolean'"><label class="block text-sm"><span class="block text-xs font-semibold mb-1.5" x-text="field.label + (field.required ? ' *' : '')"></span><template x-if="field.kind === 'textarea'"><textarea class="ux-input w-full" rows="3" x-model="generateModal.typeFields[field.key]" :required="field.required"></textarea></template><template x-if="field.kind === 'select'"><select class="ux-input w-full" x-model="generateModal.typeFields[field.key]" :required="field.required"><option value="">— wybierz —</option><template x-for="option in field.options" :key="option"><option :value="option" x-text="option"></option></template></select></template><template x-if="!['textarea','select'].includes(field.kind)"><input :type="field.kind" class="ux-input w-full" x-model="generateModal.typeFields[field.key]" :required="field.required"></template></label></template></div></template></div></div>
        <div x-show="generationFields().length" class="rounded-2xl border border-gray-200 dark:border-gray-700 bg-gray-50/70 dark:bg-gray-750 p-4 space-y-3"><h4 class="text-sm font-semibold" x-text="window.ZenI18n.t('Pola szablonu')">Pola szablonu</h4><template x-for="field in generationFields()" :key="field.name"><label class="block text-sm"><span class="block text-xs font-semibold mb-1.5" x-text="field.label"></span><input class="ux-input w-full" x-model="generateModal.custom[field.name]"></label></template></div>
        <p x-show="generateModal.error" x-text="generateModal.error" class="text-red-600" role="alert"></p>
        <div class="flex justify-end gap-2"><button type="button" class="ux-text-button" @click="generateModal.open = false" x-text="window.ZenI18n.t('Anuluj')">Anuluj</button><button type="submit" class="ux-button" x-text="window.ZenI18n.t('Generuj')">Generuj</button></div>
    </form>
</div>
