services:
  zencrm:
    image: kosiorekmateusz/zencrm:latest
    build: .
    container_name: zencrm
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - DATABASE_URL=sqlite:////app/instance/zencrm.db
      - PORT=8080
    volumes:
      - zencrm_data:/app/instance
      - zencrm_uploads:/app/uploads

volumes:
  zencrm_data:
  zencrm_uploads:
