name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      ghcr_image: ${{ steps.version.outputs.ghcr_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){2,3}(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid tag $TAG"; exit 1; }
          version="${TAG#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          [ "$version" = "$file_version" ] || { echo "Tag $version does not match VERSION $file_version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tagged commit is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "ghcr_image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  build:
    needs: [verify, test]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Environment secrets are readable only in jobs bound to the release environment, so check them here, before any push.
      - name: Check Docker Hub secrets
        if: vars.DOCKERHUB_IMAGE != ''
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: '[ -n "$USERNAME" ] && [ -n "$TOKEN" ] || { echo "DOCKERHUB_IMAGE is set but Docker Hub secrets are missing"; exit 1; }'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: zencrm:release
          build-args: ZENCRM_VERSION=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: .github/scripts/container-smoke.sh zencrm:release zencrm-release 8081
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: vars.DOCKERHUB_IMAGE != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Rebuilt from the cache of the smoke-tested build, then pushed without tags; tags are added in publish.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: ZENCRM_VERSION=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,"name=${{ needs.verify.outputs.ghcr_image }}${{ vars.DOCKERHUB_IMAGE != '' && format(',docker.io/{0}', vars.DOCKERHUB_IMAGE) || '' }}",push-by-digest=true,name-canonical=true,push=true
      - name: Save digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: vars.DOCKERHUB_IMAGE != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-architecture manifests
        id: manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          GHCR_IMAGE: ${{ needs.verify.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        working-directory: digests
        run: |
          for image in "$GHCR_IMAGE" ${DOCKERHUB_IMAGE:+docker.io/$DOCKERHUB_IMAGE}; do
            tags=(-t "$image:$VERSION")
            [ "$PRERELEASE" = "false" ] && tags+=(-t "$image:latest")
            sources=()
            for digest in *; do sources+=("$image@sha256:$digest"); done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          done
          echo "digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.verify.outputs.ghcr_image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # Last on purpose: Settings → Updates reads GitHub Releases, so a Release must never precede its image.
  release:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          GHCR_IMAGE: ${{ needs.verify.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 0; fi
          {
            echo "## Docker images"
            echo
            echo '```'
            echo "docker pull $GHCR_IMAGE:$VERSION"
            if [ -n "$DOCKERHUB_IMAGE" ]; then echo "docker pull $DOCKERHUB_IMAGE:$VERSION"; fi
            echo '```'
          } > notes.md
          flags=(--verify-tag --generate-notes --notes-file notes.md --title "$VERSION")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${flags[@]}"
